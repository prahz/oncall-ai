<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>oncall</title>
<style>
  :root{
    --bg:#0a0c10; --surface:#111620; --surface2:#171d28; --surface3:#1f2733;
    --border:#242c39; --border2:#2f3947;
    --text:#e7ecf3; --muted:#8a94a6; --dim:#5b6576;
    --accent:#3b82f6; --accent-h:#60a5fa; --accent-soft:#132135; --accent-ring:rgba(59,130,246,.30);
    --crit:#ef4444; --crit-soft:#2a1315; --high:#f97316; --med:#3b82f6; --low:#64748b;
    --ok:#22c55e; --ok-soft:#0f2417; --warn:#f59e0b; --warn-soft:#241a06;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 10px 30px rgba(0,0,0,.4); --shadow-lg:0 22px 60px rgba(0,0,0,.55);
    --sidebar:236px;
  }
  :root[data-theme="light"]{
    --bg:#f5f6f8; --surface:#ffffff; --surface2:#f1f3f6; --surface3:#e7eaef;
    --border:#e4e7ec; --border2:#d5dae2;
    --text:#111725; --muted:#5c6675; --dim:#98a2b1;
    --accent:#2563eb; --accent-h:#1d4ed8; --accent-soft:#eaf1ff; --accent-ring:rgba(37,99,235,.20);
    --crit:#e5484d; --crit-soft:#fdecec; --high:#f76808; --med:#2563eb; --low:#8b97a8;
    --ok:#12a150; --ok-soft:#e6f6ec; --warn:#f5a524; --warn-soft:#fdf4e3;
    --shadow-sm:0 1px 2px rgba(20,25,40,.06),0 1px 3px rgba(20,25,40,.05); --shadow-md:0 8px 24px rgba(20,25,40,.1); --shadow-lg:0 18px 50px rgba(20,25,40,.18);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
    background:radial-gradient(1100px 520px at 50% -280px,rgba(59,130,246,.06),transparent 70%),var(--bg);background-attachment:fixed}
  :root[data-theme="light"] body{background:var(--bg)}
  a{color:var(--accent);text-decoration:none}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:var(--border2);background-clip:padding-box}
  button{font:inherit;border:0;border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;transition:.13s;white-space:nowrap;color:var(--text)}
  button:disabled{opacity:.5;cursor:default}
  input,select,textarea{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:8px 11px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  h1,h2,h3,h4{margin:0}

  .app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
  .side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:3px;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 12px}
  .logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;box-shadow:0 4px 14px var(--accent-ring);flex:none}
  .logo svg{width:18px;height:18px;color:#fff}
  .brand .nm{font-size:19px;font-weight:800;letter-spacing:-.4px}
  .brand .tag{color:var(--dim);font-size:10.5px;margin-top:-3px;font-weight:500}
  .navitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px}
  .navitem:hover{background:var(--surface2);color:var(--text)}
  .navitem.on{background:var(--accent-soft);color:var(--accent)}
  .navitem svg{width:17px;height:17px;flex:none}
  .navitem .cnt{margin-left:auto;font-size:11px;background:var(--surface3);color:var(--muted);border-radius:20px;padding:1px 8px;font-weight:700;min-width:22px;text-align:center}
  .navitem.on .cnt{background:var(--accent);color:#fff}
  .side .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);font-weight:700;padding:14px 12px 6px}
  .live{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:var(--muted);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2.4s infinite;flex:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .foot{margin-top:auto;padding-top:12px}
  .themeToggle{display:flex;align-items:center;gap:9px;width:100%;background:var(--surface2);border:1px solid var(--border);justify-content:flex-start;color:var(--muted);font-size:12.5px}
  .themeToggle:hover{background:var(--surface3)} .themeToggle svg{width:15px;height:15px}

  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 24px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .topbar h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
  .topbar .sub{color:var(--dim);font-size:12px;margin-top:-2px}
  .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{background:var(--surface);color:var(--text);border:1px solid var(--border2);display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow-sm)}
  .btn:hover{background:var(--surface2)} .btn.primary{background:var(--accent);border:0;color:#fff;box-shadow:0 4px 14px var(--accent-ring)} .btn.primary:hover{background:var(--accent-h)}
  .btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px} .btn svg{width:15px;height:15px}
  .btn.ghost{background:transparent;box-shadow:none}
  .content{padding:20px 24px 34px;display:flex;flex-direction:column;gap:18px}

  .menu-wrap{position:relative}
  .menu{position:absolute;right:0;top:calc(100% + 8px);width:352px;background:var(--surface);border:1px solid var(--border2);border-radius:13px;box-shadow:var(--shadow-lg);padding:6px;z-index:60;display:none;max-height:min(74vh,560px);overflow:auto}
  .menu.open{display:block;animation:pop .13s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .menu .mh{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);font-weight:700;padding:9px 10px 5px}
  .mi{display:flex;gap:11px;align-items:flex-start;padding:9px 10px;border-radius:9px;cursor:pointer}
  .mi:hover{background:var(--surface2)} .mi .em{font-size:15px;flex:none;width:20px;text-align:center;margin-top:1px}
  .mi .t{font-weight:600;font-size:13px} .mi .d{color:var(--muted);font-size:11.5px;margin-top:1px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden}
  .card>.h{padding:14px 17px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:9px}
  .card>.h .count{margin-left:auto;color:var(--dim);font-weight:600;font-size:12px}
  .pill{background:var(--warn);color:#231a00;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px}
  .grow{flex:1}

  .kpis{display:grid;gap:14px} .kpis.k5{grid-template-columns:repeat(5,1fr)} .kpis.k4{grid-template-columns:repeat(4,1fr)}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 17px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:.16s}
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .kpi .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;margin-bottom:11px;background:var(--surface3);color:var(--muted)} .kpi .ic svg{width:16px;height:16px}
  .kpi .n{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.8px;line-height:1} .kpi .l{color:var(--muted);font-size:12px;margin-top:5px;font-weight:500}
  .kpi .sub{color:var(--dim);font-size:11px;margin-top:3px}
  .kpi.acc .ic{background:var(--accent-soft);color:var(--accent)} .kpi.acc .n{color:var(--accent)}
  .kpi.ok .ic{background:var(--ok-soft);color:var(--ok)} .kpi.ok .n{color:var(--ok)}
  .kpi.warn .ic{background:var(--warn-soft);color:var(--warn)} .kpi.warn .n{color:var(--warn)}

  .row2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
  .spark{display:flex;align-items:flex-end;gap:5px;height:64px;padding:6px 0}
  .spark .bar{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
  .spark .bar:last-child{background:var(--accent-h)}
  .donut{width:120px;height:120px;border-radius:50%;position:relative;flex:none}
  .donut .hole{position:absolute;inset:20px;background:var(--surface);border-radius:50%;display:grid;place-items:center;text-align:center}
  .donut .hole b{font-size:22px;font-weight:800} .donut .hole span{font-size:10px;color:var(--muted)}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px}
  .legend div{display:flex;align-items:center;gap:8px} .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

  .dial .rowv{display:flex;align-items:center;gap:14px}
  .dial input[type=range]{flex:1;accent-color:var(--accent)}
  .dial .val{font-size:22px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;min-width:56px}
  .actfeed{max-height:300px;overflow:auto}
  .actrow{display:flex;gap:11px;padding:10px 17px;border-bottom:1px solid var(--border);font-size:13px;align-items:flex-start}
  .actrow:last-child{border-bottom:0}
  .actrow .ad{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:var(--muted)}
  .actrow .ad.ok{background:var(--ok)} .actrow .ad.acc{background:var(--accent)} .actrow .ad.warn{background:var(--warn)} .actrow .ad.crit{background:var(--crit)}
  .actrow .at{flex:1} .actrow .aw{color:var(--dim);font-size:11px;font-family:var(--mono);white-space:nowrap}

  /* sandbox */
  .prail{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .pcard{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 15px;cursor:pointer;transition:.13s;display:flex;gap:12px;align-items:flex-start}
  .pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)} .pcard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-ring)}
  .pcard .pe{font-size:22px} .pcard .pn{font-weight:700;display:flex;align-items:center;gap:7px} .pcard .pp{font-size:11px;color:var(--dim);margin-top:2px;font-family:var(--mono)} .pcard .pd{font-size:11.5px;color:var(--muted);margin-top:5px}
  .pcard.add{align-items:center;justify-content:center;color:var(--muted);border-style:dashed;font-weight:600}
  .prov{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;border-radius:5px;background:var(--surface3);color:var(--muted)}
  .phz{display:flex;gap:8px;margin-top:8px;font-size:11px;color:var(--dim)}
  .run{display:flex;align-items:center;gap:12px;padding:12px 17px;border-bottom:1px solid var(--border);font-size:13px}
  .run:last-child{border-bottom:0}
  .run .rs{width:9px;height:9px;border-radius:50%;flex:none}
  .rs.passing,.rs.fixed{background:var(--ok)} .rs.failing{background:var(--crit)} .rs.running{background:var(--warn);animation:pulse 1.6s infinite}
  .run .rnum{font-family:var(--mono);color:var(--dim);font-size:11.5px;min-width:44px}
  .run .rmsg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .run .rmeta{color:var(--dim);font-size:11px;font-family:var(--mono)}
  .rbadge{font-size:10px;font-weight:800;letter-spacing:.3px;padding:3px 8px;border-radius:6px;text-transform:uppercase}
  .rbadge.passing,.rbadge.fixed{background:var(--ok-soft);color:var(--ok)} .rbadge.failing{background:var(--crit-soft);color:var(--crit)} .rbadge.running{background:var(--warn-soft);color:var(--warn)}

  .grid{display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1.25fr);gap:18px}
  .tabs{display:flex;gap:4px;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface2)}
  .tabf{font-size:12px;font-weight:600;color:var(--muted);padding:5px 11px;border-radius:8px;cursor:pointer}
  .tabf:hover{background:var(--surface3)} .tabf.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}
  .feed{max-height:62vh;overflow:auto}
  .inc{display:flex;align-items:center;gap:11px;padding:13px 17px;border-bottom:1px solid var(--border);cursor:pointer;border-left:3px solid transparent;transition:.1s}
  .inc:hover{background:var(--surface2)} .inc.sel{background:var(--accent-soft);border-left-color:var(--accent)}
  .inc .num{font-family:var(--mono);color:var(--dim);font-size:11.5px;min-width:50px} .inc .ti{flex:1;min-width:0}
  .inc .ti .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600} .inc .svc2{color:var(--muted);font-size:11.5px;margin-top:1px}
  .badge{font-size:10px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
  .b-critical{background:var(--crit-soft);color:var(--crit)} .b-high{background:color-mix(in srgb,var(--high) 16%,transparent);color:var(--high)} .b-medium{background:var(--accent-soft);color:var(--med)} .b-low{background:color-mix(in srgb,var(--low) 22%,transparent);color:var(--low)}
  .st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid var(--border2);color:var(--muted);text-transform:capitalize;white-space:nowrap}
  .st-resolved,.st-pushed,.st-solved{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
  .st-mitigating,.st-triaging,.st-detected,.st-working,.st-queued{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-soft)}
  .st-rejected,.st-failed{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent);background:var(--crit-soft)}
  .mttr{font-family:var(--mono);font-size:11px;color:var(--ok);background:var(--ok-soft);padding:2px 7px;border-radius:6px;white-space:nowrap}

  .appr{padding:15px 17px;background:var(--warn-soft);border-bottom:1px solid var(--border)}
  .appr .fix{background:var(--surface);border:1px solid var(--border2);border-left:3px solid var(--accent);border-radius:9px;padding:10px 12px;font-size:13px;margin:10px 0}
  .appr .acts{display:flex;gap:9px;flex-wrap:wrap}
  .approve{background:var(--ok);color:#fff;box-shadow:0 4px 12px rgba(34,197,94,.28)} .approve:hover{filter:brightness(1.06)}
  .reject{background:transparent;color:var(--crit);border:1px solid color-mix(in srgb,var(--crit) 45%,transparent)} .reject:hover{background:var(--crit-soft)}
  .agentbtn{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-ring)} .agentbtn:hover{background:var(--accent);color:#fff}
  .humanbtn{background:var(--surface2);color:var(--text);border:1px solid var(--border2)} .humanbtn:hover{background:var(--surface3)}
  .empty{padding:34px 18px;text-align:center;color:var(--dim);font-size:13px} .skel{padding:20px;color:var(--dim);font-size:13px}

  .det .kv{display:grid;grid-template-columns:116px 1fr;gap:8px 14px;padding:16px 17px;font-size:13px} .det .kv .k{color:var(--dim)}
  .det .sec{padding:15px 17px;border-top:1px solid var(--border)} .det .sec h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:11px}
  .gauge .top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px} .gauge .sc{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums} .gauge .of{color:var(--dim);font-size:12px}
  .gauge .bar{height:10px;border-radius:6px;background:var(--surface3);overflow:hidden} .gauge .fill{height:100%;border-radius:6px;transition:width .5s ease}
  .gauge .brk{margin-top:10px;display:flex;flex-direction:column;gap:4px} .gauge .brk div{font-size:11.5px;color:var(--muted);padding-left:14px;position:relative} .gauge .brk div::before{content:"›";position:absolute;left:0;color:var(--dim)}
  .linkrow{display:flex;gap:9px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:7px 11px;font-size:12.5px;color:var(--text);cursor:pointer} .chip:hover{border-color:var(--accent);color:var(--accent)}
  .tl{position:relative;margin-left:6px;padding-left:18px} .tl::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--border2)}
  .tl .ev{position:relative;padding:5px 0 12px} .tl .ev::before{content:"";position:absolute;left:-18px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 2px var(--border2)}
  .tl .ev.done::before{background:var(--ok)} .tl .ev.warnd::before{background:var(--warn)} .tl .ev.critd::before{background:var(--crit)}
  .tl .et{font-size:13px} .tl .em2{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:1px}

  .dcol{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .dcolh{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .dcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 15px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
  .dcard .dt{font-weight:700;font-size:13.5px;margin-bottom:3px} .dcard .dm{color:var(--muted);font-size:12px;margin-bottom:9px}
  .who{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;margin-right:6px}
  .who.agent{background:var(--accent-soft);color:var(--accent)} .who.human{background:var(--surface3);color:var(--text)}
  .dcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  .amx{width:100%;border-collapse:collapse} .amx th,.amx td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
  .amx th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);font-weight:700} .amx td.c{text-align:center} .amx tr:last-child td{border-bottom:0}
  .amx .evd{color:var(--muted);font-size:11.5px}
  .sw{position:relative;width:38px;height:21px;border-radius:20px;background:var(--surface3);border:1px solid var(--border2);cursor:pointer;transition:.15s;flex:none;display:inline-block;vertical-align:middle}
  .sw::after{content:"";position:absolute;top:1px;left:1px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:.15s} .sw.on{background:var(--ok)} .sw.on::after{transform:translateX(17px)} .sw.busy{opacity:.5}

  .rbcard{display:flex;align-items:center;gap:12px;padding:13px 17px;border-bottom:1px solid var(--border)}
  .rbcard:last-child{border-bottom:0} .rbcard .rbn{font-weight:700} .rbcard .rbt{font-size:11.5px;color:var(--dim)}

  .modal{position:fixed;inset:0;background:rgba(4,7,12,.6);backdrop-filter:blur(5px);z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
  .modal.open{display:flex;animation:pop .15s ease}
  .modal .mcard{background:var(--surface);border:1px solid var(--border2);border-radius:16px;max-width:880px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
  .modal .mhd{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--border)} .modal .mhd h3{font-size:15px;font-weight:700;flex:1}
  .modal .x{background:var(--surface2);border:1px solid var(--border2);width:32px;height:32px;padding:0;border-radius:9px;color:var(--muted);font-size:16px}
  .modal .mbody{padding:16px 22px 22px;overflow:auto}
  .logbox{background:#06080c;color:#c4cfdd;border-radius:11px;padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.65;white-space:pre-wrap;overflow:auto;max-height:60vh;border:1px solid #1c2531}
  .logbox .er{color:#ff6b7a} .logbox .ok{color:#4ade80}
  .field{display:flex;flex-direction:column;gap:5px;margin:12px 0} .field label{font-size:12px;color:var(--muted);font-weight:600}

function metrics(){
  var resolved=incidents.filter(function(i){return i.status==="resolved";});
  var durs=resolved.map(function(i){return (i.resolved_at&&i.created_at)?(new Date(i.resolved_at)-new Date(i.created_at))/1000:null;}).filter(function(x){return x!=null&&x>=0;});
  var mttr=durs.length?Math.round(durs.reduce(function(a,b){return a+b;},0)/durs.length):0;
  var pushed=delegations.filter(function(d){return d.status==="pushed";});
  var agent=pushed.filter(function(d){return d.assignee_type==="agent";}).length, human=pushed.length-agent;
  var autoRate=pushed.length?Math.round(agent/pushed.length*100):0;
  var hoursSaved=(agent*0.75+human*0.25);
  var active=incidents.filter(function(i){return ["detected","triaging","mitigating"].indexOf(i.status)>=0;}).length;
  var pend=incidents.filter(function(i){return i._await;}).length;
  return {resolved:resolved.length,mttr:mttr,autoRate:autoRate,hoursSaved:hoursSaved,agent:agent,human:human,active:active,pend:pend,total:incidents.length};
}

  incidents.forEach(function(i){ev.push({t:i.created_at,cls:"crit",x:"INC-"+i.number+" opened — "+(i.title||"incident")});if(i.resolved_at)ev.push({t:i.resolved_at,cls:"ok",x:"INC-"+i.number+" resolved · "+durStr(i.created_at,i.resolved_at)});});
  delegations.forEach(function(d){if(d.status==="pushed")ev.push({t:d.updated_at,cls:"ok",x:"Fix pushed to repo by "+(d.assignee||d.assignee_type)});else ev.push({t:d.created_at,cls:"acc",x:"Fix delegated ("+d.assignee_type+")"});});
  ev.sort(function(a,b){return new Date(b.t)-new Date(a.t);});
  ev=ev.slice(0,14);
  return ev.length?ev.map(function(e){return '<div class="actrow"><span class="ad '+e.cls+'"></span><span class="at">'+esc(e.x)+'</span><span class="aw">'+fmt(e.t)+'</span></div>';}).join(""):'<div class="empty">No activity yet — run the demo or simulate a failure.</div>';
}

    await loadAll();toast("Clean slate — ready to demo","ok");render();
  }catch(e){toast("Reset failed: "+(e&&e.message),"err");}finally{busy=false;}
}

/* ================= triage + notify ================= */
function triage(sev,blast,conf){var brk=[];var sp={critical:50,high:30,medium:15,low:5};var s=sp[sev]!=null?sp[sev]:15;brk.push("severity "+sev+" = +"+s);var score=s;var bp={single_service:0,multi_service:15,infrastructure:30};var b=bp[blast]||0;if(b){brk.push("blast radius "+blast+" = +"+b);}score+=b;var h=new Date().getUTCHours();if(h>=0&&h<=6){brk.push("off-hours (00:00–06:00 UTC) = +10");score+=10;}if(conf<0.6){brk.push("low confidence adds risk = +10");score+=10;}score=Math.max(0,Math.min(100,score));var band=score>=70?"critical":score>=45?"high":score>=25?"medium":"low";var order=["low","medium","high","critical"];var final=order[Math.max(order.indexOf(sev),order.indexOf(band))];brk.push("score "+score+"/100 → band "+band+"; final = max("+sev+", "+band+") = "+final);return {score:score,reason:brk.join(" · "),final:final};}
function ruleFor(ch,ev,pid){return alertRules.filter(function(r){return r.channel===ch&&r.event===ev&&(r.project_id===pid||!r.project_id);});}
function eventEnabled(ch,ev,pid){var m=ruleFor(ch,ev,pid);if(!m.length)return true;return m.some(function(r){return r.enabled;});}
function eventTarget(ch,ev,pid){var m=ruleFor(ch,ev,pid).filter(function(r){return r.target;})[0];return m?m.target:null;}
var ESC_DEFAULT={manual_approval:1,escalation:1,delegation_agent:1,delegation_human:1};
function slackText(ev,inc){var num=inc.number,title=inc.title||"incident",svc=inc.service||"unknown",sev=(inc.severity||"").toUpperCase(),conf=inc.confidence!=null?Math.round(inc.confidence*100)+"%":"—",head="INC-"+num+" · "+title,dash="<"+window.location.origin+"|Open the oncall dashboard →>";
  if(ev==="manual_approval")return ":rotating_light: *Approval needed — "+head+"*\n*Service:* "+svc+"   *Severity:* "+sev+"   *Confidence:* "+conf+"\n*Root cause:* "+(inc.root_cause||"—")+"\n*Proposed fix:* "+(inc.suggested_fix||"—")+"\n*Approve / reject:* "+dash;
  if(ev==="escalation")return ":warning: *Escalation — "+head+"*\nAutomated remediation did not hold — a human is needed.";
  if(ev==="delegation_agent")return ":robot_face: *Agent delegation — "+head+"*\nThe fix ("+(inc.suggested_fix||"remediation")+") was handed to the AI agent. It will patch and open a PR.";
  if(ev==="delegation_human")return ":bust_in_silhouette: *Human delegation — "+head+"*\nAssigned to on-call. Please review & push: "+dash;
  if(ev==="rejected")return ":no_entry: *Rejected — "+head+"*\nRemediation was rejected and escalated to a human.";
  return ":white_check_mark: *Resolved & pushed — "+head+"*\n*Service:* "+svc+"\n*Fix:* "+(inc.suggested_fix||"—")+"  → pushed to "+(inc._branch||"main");}
function notifyChannels(ev,inc,pid){try{var text=slackText(ev,inc);notif.forEach(function(r){if(r.enabled!==true||!r.auth_config||!r.send_operation)return;var ch=r.channel;if(!eventEnabled(ch,ev,pid))return;var target=eventTarget(ch,ev,pid)||(ESC_DEFAULT[ev]?(r.escalations_target||r.incidents_target):(r.incidents_target||r.escalations_target));if(!target)return;var payload={body:{}};payload.body[r.target_field||"channel"]=target;payload.body.text=text;try{client.connectors.operations.execute({organizationId:ORG_ID,authConfigName:r.auth_config},r.send_operation,payload,r.account_id||undefined).catch(function(){});}catch(e){}});}catch(e){}}

/* ================= lifecycle ================= */
async function simulateFailure(i){
  if(busy)return;busy=true;
  var sc=SCEN[i],pid=selectedProject,proj=pById(pid);
  try{
    var autoSafe=(runbookSafe[sc.service]!==undefined)?runbookSafe[sc.service]:(["api-gateway","image-processing-worker","automated-service"].indexOf(sc.service)>=0);
    var tri=triage(sc.severity,sc.blast,sc.confidence);
    var autoOk=autoSafe&&(sc.confidence*100>=AUTONOMY)&&tri.final!=="critical"&&sc.blast!=="infrastructure";
    var sha=Math.random().toString(16).slice(2,9);
    var run=await client.records.create("ci_runs",{project_id:pid,pipeline:sc.pipeline,run_number:140+Math.floor(Math.random()*60),ref:"main",commit_sha:sha,commit_msg:sc.title,status:"failing",stage:sc.stage,service:sc.service,error_signature:sc.err,logs:sc.logs});
    var alertObj={message:sc.err+" — "+sc.stage,source:proj?proj.provider:"ci",severity:sc.severity,metric:sc.stage,created_at:nowISO()};
    var inc=await client.records.create("incidents",{title:sc.title,service:sc.service,severity:tri.final,status:"triaging",blast_radius:sc.blast,root_cause:sc.root,confidence:sc.confidence,suggested_fix:sc.fix,suspect_deploy:sc.suspect,affected_services:[sc.service],triggering_alerts:[alertObj],triage_score:tri.score,triage_reason:tri.reason,heal_attempts:0,project_id:pid,ci_run_id:run.id});
    await client.records.update("ci_runs",run.id,{incident_id:inc.id});
    await client.records.create("remediation_actions",{incident_id:inc.id,action_type:sc.action,description:sc.fix,confidence:sc.confidence,auto_approved:autoOk,status:autoOk?"approved":"pending_approval",executed_by:autoOk?"agent":null,result:autoOk?null:("Gated: "+(autoSafe?"":"runbook not auto-safe; ")+(tri.final==="critical"?"critical severity; ":"")+"needs human approval")});
    selectedIncident=inc.id;
    toast("INC-"+inc.number+" opened from "+(proj?proj.name:"CI")+" · "+(autoOk?"auto-remediating":"needs approval"),autoOk?"ok":"");
    await loadAll();if(tab!=="incidents")render();
    if(autoOk){await sleep(900);await client.records.update("incidents",inc.id,{status:"mitigating",mitigated_at:nowISO()});await loadAll();render();var dl=await createDelegation(inc,run,"agent");await runAgent(dl.id);}
    else{notifyChannels("manual_approval",inc,pid);}
    render();
  }catch(e){toast("Failed: "+(e&&e.message),"err");}finally{busy=false;}
}
async function createDelegation(inc,run,type){return await client.records.create("delegations",{incident_id:inc.id,project_id:inc.project_id,ci_run_id:inc.ci_run_id||(run&&run.id),title:inc.title,assignee_type:type||"agent",assignee:"",status:"queued",summary:inc.suggested_fix});}
async function runAgent(delId){var d=await client.records.get("delegations",delId);var inc=await client.records.get("incidents",d.incident_id);
  await client.records.update("delegations",delId,{assignee_type:"agent",assignee:"ai-agent",status:"working"});notifyChannels("delegation_agent",inc,inc.project_id);await loadAll();render();
  await sleep(1600);await client.records.update("delegations",delId,{status:"solved",notes:"agent patched "+inc.service+" and validated the fix"});await loadAll();render();
  await sleep(1300);await pushFix(delId,"ai-agent");}
async function assignHuman(delId){if(busy)return;busy=true;try{var d=await client.records.get("delegations",delId);var inc=await client.records.get("incidents",d.incident_id);await client.records.update("delegations",delId,{assignee_type:"human",assignee:"you@oncall",status:"working"});notifyChannels("delegation_human",inc,inc.project_id);toast("Assigned to you — click ‘Solve & push’ when ready","ok");await loadAll();render();}catch(e){toast("Failed","err");}finally{busy=false;}}
async function assignAgentManual(delId){if(busy)return;busy=true;try{await runAgent(delId);}catch(e){toast("Failed","err");}finally{busy=false;}}
async function pushFix(delId,by){var d=await client.records.get("delegations",delId);var inc=await client.records.get("incidents",d.incident_id);var proj=pById(inc.project_id);var pr=(proj?proj.repo_url:"")+"/pull/"+(1000+Math.floor(Math.random()*8999));inc._branch=proj?proj.default_branch:"main";
  await client.records.update("delegations",delId,{status:"pushed",pr_url:pr,assignee:by,notes:"pushed fix to "+(proj?proj.default_branch:"main")});
  var acts=(await client.records.list("remediation_actions",{limit:5,filters:[{field:"incident_id",op:"eq",value:inc.id}],sort:[{field:"created_at",direction:"desc"}]})).items||[];
  await resolveIncident(inc,acts[0],"fix delegated to "+by+" and pushed to "+(proj?proj.default_branch:"main"),by);
  if(inc.ci_run_id){try{await client.records.update("ci_runs",inc.ci_run_id,{status:"fixed"});}catch(e){}}
  notifyChannels("incident_resolved",inc,inc.project_id);await loadAll();render();}
async function resolveIncident(inc,action,resultText,by){var t=nowISO();if(action){try{await client.records.update("remediation_actions",action.id,{status:"executed",executed_by:by||"agent",result:resultText});}catch(e){}}var full=await client.records.get("incidents",inc.id);var md=postmortemMd(full,action,resultText,t);await client.records.update("incidents",inc.id,{status:"resolved",resolved_at:t,mitigated_at:full.mitigated_at||t,postmortem_md:md});writePostmortemFile(full.number,md,inc.id);appendRunbookLesson(full);}
function postmortemMd(inc,action,resultText,resolvedAt){var al=(inc.triggering_alerts&&inc.triggering_alerts[0])||{};var n=inc.number,act=(action&&action.action_type)||"remediation",proj=pById(inc.project_id);return "# INC-"+n+": "+(inc.title||"Incident")+"\n\n**Project:** "+(proj?proj.name:"—")+"  ·  **Service:** "+inc.service+"  ·  **Severity:** "+inc.severity+"  ·  **Blast radius:** "+(inc.blast_radius||"single_service")+"\n**Duration:** "+fmt(inc.created_at)+" → "+fmt(resolvedAt)+"  ("+durStr(inc.created_at,resolvedAt)+")\n\n## Summary\n"+(inc.root_cause||"")+" The AI applied `"+act+"`, the health re-check passed, and the fix was pushed to the repo.\n\n## Timeline\n- "+fmt(al.created_at||inc.created_at)+" — CI failure: "+(al.message||"pipeline failed")+"\n- "+fmt(resolvedAt)+" — "+act+": "+(resultText||"applied")+"\n- "+fmt(resolvedAt)+" — incident resolved & pushed\n\n## Root cause\n"+(inc.root_cause||"—")+(inc.suspect_deploy&&inc.suspect_deploy!=="unknown"?(" Suspect deploy: `"+inc.suspect_deploy+"`."):"")+"\n\n## What worked\n"+(inc.suggested_fix||"The remediation")+" resolved the incident; automated health re-check confirmed recovery.\n\n## Lessons learned\n- The runbook for `"+inc.service+"` matched this signature — triage and fix were unambiguous.\n- Triage scored this "+inc.triage_score+"/100 ("+(inc.severity==="critical"?"human approval required":"safe to auto-remediate")+").\n\n## Action items\n- [ ] Confirm the fix held over the next few hours.\n- [ ] Add a regression test for this signature in `"+inc.service+"`.\n";}
async function writePostmortemFile(number,md,incId){try{var file=new File([md],"INC-"+number+".md",{type:"text/markdown"});await client.files.upload(file,{directoryPath:"/postmortems",searchEnabled:false});await client.records.update("incidents",incId,{postmortem_path:"/postmortems/INC-"+number+".md"});}catch(e){}}
async function appendRunbookLesson(inc){try{var rows=(await client.records.list("runbooks",{limit:1,filters:[{field:"service",op:"eq",value:inc.service}]})).items||[];if(!rows.length)return;var rb=rows[0];if((rb.content||"").indexOf("INC-"+inc.number+" (")>=0)return;var entry="\n\n## Incident log — INC-"+inc.number+" ("+fmt(inc.resolved_at||nowISO())+")\n- **What happened:** "+(inc.title||"incident")+"\n- **What fixed it:** "+(inc.suggested_fix||"remediation")+"\n- **Lesson:** Signature matched the runbook; triage scored "+inc.triage_score+"/100.\n";await client.records.update("runbooks",rb.id,{content:(rb.content||"")+entry});}catch(e){}}

/* ================= INCIDENTS ================= */
function incPass(i){if(incFilter==="all")return true;if(incFilter==="active")return ["detected","triaging","mitigating"].indexOf(i.status)>=0;if(incFilter==="resolved")return i.status==="resolved";if(incFilter==="await")return i._await;return true;}
function renderIncidents(){
  var v=document.getElementById("view");var m=metrics();
  var kpis='<div class="kpis k4">'+okpi("warn","alert",m.active,"Active incidents",m.pend+" awaiting approval")+okpi("ok","check",m.agent,"Agent-fixed & pushed","")+okpi("acc","clock",mttrStr(m.mttr),"Avg resolve time","")+okpi("ok","medal",m.resolved,"Total resolved","")+'</div>';
  var shown=incidents.filter(incPass);

  v.innerHTML=kpis+'<div class="grid"><div class="card"><div class="tabs">'+['all','active','await','resolved'].map(function(f){return '<div class="tabf'+(incFilter===f?' on':'')+'" data-f="'+f+'">'+(f==="await"?"Awaiting":f.charAt(0).toUpperCase()+f.slice(1))+'</div>';}).join("")+'<span style="margin-left:auto;align-self:center;color:var(--dim);font-size:12px">'+shown.length+' of '+incidents.length+'</span></div><div class="feed" id="ifeed">'+list+'</div></div><div class="card det"><div class="h">Incident detail</div><div id="idetail"></div></div></div>';
  Array.prototype.forEach.call(v.querySelectorAll(".tabf"),function(t){t.onclick=function(){incFilter=t.getAttribute("data-f");render();};});
  Array.prototype.forEach.call(v.querySelectorAll("#ifeed .inc"),function(n){n.onclick=function(){selectedIncident=n.getAttribute("data-id");render();};});
  loadIncidentDetail();

async function loadIncidentDetail(){
  var el=document.getElementById("idetail");if(!el)return;var inc=incidents.filter(function(i){return i.id===selectedIncident;})[0];
  if(!inc){el.innerHTML='<div class="empty">Select an incident to see its diagnosis, triage math, timeline and post-mortem.</div>';return;}
  var actions=[];try{actions=(await client.records.list("remediation_actions",{limit:50,filters:[{field:"incident_id",op:"eq",value:inc.id}],sort:[{field:"created_at",direction:"asc"}]})).items||[];}catch(e){}
  var pend=actions.filter(function(a){return a.status==="pending_approval";})[0];
  var alerts=[];(inc.triggering_alerts||[]).forEach(function(a){if(a&&typeof a==="object"&&a.message)alerts.push(a);});
  var score=inc.triage_score,proj=pById(inc.project_id);
  var appr=pend?('<div class="appr"><h4>⚠ Needs human approval</h4><div class="fix"><b>Proposed fix:</b> '+esc(inc.suggested_fix||"—")+'</div><div class="acts"><button class="approve" id="ap-y">Approve &amp; delegate</button><button class="reject" id="ap-n">Reject</button></div></div>'):'';
  var gauge=score!=null?('<div class="sec"><h4>Triage score — how the AI decided</h4><div class="gauge"><div class="top"><span class="sc" style="color:'+sevColor(inc.severity)+'">'+esc(score)+'</span><span class="of">/ 100 · '+esc(inc.severity)+'</span></div><div class="bar"><div class="fill" style="width:'+Math.max(4,Math.min(100,score))+'%;background:'+sevColor(inc.severity)+'"></div></div>'+(inc.triage_reason?'<div class="brk">'+inc.triage_reason.split(" · ").map(function(x){return '<div>'+esc(x)+'</div>';}).join("")+'</div>':'')+'</div></div>'):'';
  var events=[];alerts.forEach(function(x){events.push({cls:"critd",t:esc(x.message||"CI failure"),m:(x.source||"")+" · "+fmt(x.created_at)});});
  actions.forEach(function(x){var cls=x.status==="executed"?"done":x.status==="failed"?"warnd":x.status==="rejected"?"critd":"";events.push({cls:cls,t:esc(x.action_type)+" — "+esc(x.result||x.description||x.status)+(x.auto_approved?" (auto)":""),m:(x.executed_by||"agent")+" · "+fmt(x.updated_at)});});
  delegations.filter(function(d){return d.incident_id===inc.id;}).forEach(function(d){events.push({cls:d.status==="pushed"?"done":"",t:"delegated to "+d.assignee_type+(d.status==="pushed"?" · pushed":" · "+d.status),m:(d.assignee||d.assignee_type)+" · "+fmt(d.updated_at)});});
  if(inc.resolved_at)events.push({cls:"done",t:"Incident resolved · pushed to repo · "+durStr(inc.created_at,inc.resolved_at),m:fmt(inc.resolved_at)});
  var links='';if(inc.postmortem_md)links+='<span class="chip" onclick="viewMarkdown(\'Post-mortem · INC-'+esc(inc.number)+'\',window.__pm)">📄 Post-mortem</span>';if(inc.service)links+='<span class="chip" onclick="viewRunbook(\''+esc(inc.service)+'\')">📕 Runbook</span>';if(inc.ci_run_id)links+='<span class="chip" onclick="viewLogs(\''+esc(inc.ci_run_id)+'\')">📜 CI logs</span>';window.__pm=inc.postmortem_md||"";
  el.innerHTML=appr+'<div class="kv"><span class="k">Incident</span><span>INC-'+esc(inc.number)+' · '+sevBadge(inc.severity)+' '+stBadge(inc.status)+'</span><span class="k">Project</span><span>'+(proj?esc(proj.emoji+" "+proj.name):"—")+'</span><span class="k">Service</span><span>'+esc(inc.service)+' · '+esc(inc.blast_radius||"single_service")+'</span><span class="k">Root cause</span><span>'+esc(inc.root_cause||"—")+'</span><span class="k">Suggested fix</span><span>'+esc(inc.suggested_fix||"—")+'</span><span class="k">Confidence</span><span>'+esc(inc.confidence!=null?Math.round(inc.confidence*100)+"%":"—")+'</span></div>'+(links?'<div class="sec"><div class="linkrow">'+links+'</div></div>':'')+gauge+'<div class="sec"><h4>Timeline</h4>'+(events.length?'<div class="tl">'+events.map(function(e){return '<div class="ev '+e.cls+'"><div class="et">'+e.t+'</div><div class="em2">'+esc(e.m)+'</div></div>';}).join("")+'</div>':'<div class="empty">none</div>')+'</div>';
  if(pend){document.getElementById("ap-y").onclick=function(){approveIncident(inc.id,pend.id,true);};document.getElementById("ap-n").onclick=function(){approveIncident(inc.id,pend.id,false);};}
}
async function approveIncident(incId,actId,approved){if(busy)return;busy=true;try{var inc=await client.records.get("incidents",incId);if(approved){await client.records.update("remediation_actions",actId,{status:"approved",executed_by:"you@oncall"});await client.records.update("incidents",incId,{status:"mitigating",mitigated_at:nowISO()});await createDelegation(inc,inc.ci_run_id?{id:inc.ci_run_id}:null,null);toast("INC-"+inc.number+" approved — fix sent to Delegations","ok");await loadAll();setTab("delegations");}else{await client.records.update("remediation_actions",actId,{status:"rejected",executed_by:"you@oncall",result:"rejected by on-call"});notifyChannels("rejected",inc,inc.project_id);toast("INC-"+inc.number+" rejected — escalated","");await loadAll();render();}}catch(e){toast("Failed: "+(e&&e.message),"err");}finally{busy=false;}}

/* ================= DELEGATIONS ================= */
function renderDelegations(){
  var v=document.getElementById("view");
  var q=delegations.filter(function(d){return d.status==="queued";}),w=delegations.filter(function(d){return ["working","solved"].indexOf(d.status)>=0;}),done=delegations.filter(function(d){return ["pushed","rejected","failed"].indexOf(d.status)>=0;});
  function card(d){var inc=incidents.filter(function(i){return i.id===d.incident_id;})[0];var proj=pById(d.project_id);var who=d.assignee_type==="human"?'<span class="who human">👤 '+esc(d.assignee||"human")+'</span>':'<span class="who agent">🤖 '+esc(d.assignee||"AI agent")+'</span>';var acts='';
    if(d.status==="queued")acts='<button class="btn sm agentbtn" data-agent="'+d.id+'">🤖 Assign to agent</button><button class="btn sm humanbtn" data-human="'+d.id+'">👤 Assign to human</button>';
    else if(d.status==="working"&&d.assignee_type==="human")acts='<button class="btn sm approve" data-push="'+d.id+'">✅ Solve &amp; push</button><button class="btn sm reject" data-drej="'+d.id+'">Reject</button>';
    else if(d.status==="working")acts='<span class="st st-working">agent working…</span>';
    else if(d.status==="solved")acts='<span class="st st-solved">solved · pushing…</span>';
    else if(d.status==="pushed")acts='<a class="chip" href="'+esc(d.pr_url||"#")+'" target="_blank">🔗 '+esc((d.pr_url||"PR").split("/").slice(-2).join("/"))+'</a>';
    return '<div class="dcard"><div class="dt">'+(inc?"INC-"+esc(inc.number)+" · ":"")+esc(d.title)+'</div><div class="dm">'+(proj?esc(proj.emoji+" "+proj.name)+" · ":"")+esc(d.summary||"")+'</div>'+who+stBadge(d.status)+'<div class="acts">'+acts+'</div></div>';}
  v.innerHTML='<div class="dcol"><div><div class="dcolh">📥 Queued <span class="st">'+q.length+'</span></div>'+(q.length?q.map(card).join(""):'<div class="empty">Nothing queued. Approve an incident to route its fix here.</div>')+'</div><div><div class="dcolh">⚙️ In progress <span class="st">'+w.length+'</span></div>'+(w.length?w.map(card).join(""):'<div class="empty">Idle.</div>')+'</div><div><div class="dcolh">✅ Pushed / done <span class="st">'+done.length+'</span></div>'+(done.length?done.map(card).join(""):'<div class="empty">Nothing pushed yet.</div>')+'</div></div>';
  Array.prototype.forEach.call(v.querySelectorAll("[data-agent]"),function(b){b.onclick=function(){assignAgentManual(b.getAttribute("data-agent"));};});
  Array.prototype.forEach.call(v.querySelectorAll("[data-human]"),function(b){b.onclick=function(){assignHuman(b.getAttribute("data-human"));};});
  Array.prototype.forEach.call(v.querySelectorAll("[data-push]"),function(b){b.onclick=async function(){if(busy)return;busy=true;try{await pushFix(b.getAttribute("data-push"),"you@oncall");toast("Pushed to main ✓","ok");}catch(e){toast("Failed","err");}finally{busy=false;}};});
  Array.prototype.forEach.call(v.querySelectorAll("[data-drej]"),function(b){b.onclick=async function(){try{await client.records.update("delegations",b.getAttribute("data-drej"),{status:"rejected"});await loadAll();render();}catch(e){}};});
}

/* ================= RUNBOOKS ================= */
function renderRunbooks(){
  var v=document.getElementById("view");
  var rows=runbooks.slice().sort(function(a,b){return (a.service||"").localeCompare(b.service||"");});
  v.innerHTML='<div class="card"><div class="h">Runbook library <span class="count">'+rows.length+' services · the AI reads these to diagnose & fix</span></div><div>'+(rows.length?rows.map(function(r){return '<div class="rbcard"><div style="flex:1"><div class="rbn">'+esc(r.service)+'</div><div class="rbt">'+esc(r.title||"")+' · tier '+esc(r.tier||"—")+'</div></div><span class="st '+(r.auto_safe?"st-resolved":"")+'">'+(r.auto_safe?"auto-remediation safe":"human approval")+'</span><button class="btn sm" data-edit="'+r.id+'">Edit</button></div>';}).join(""):'<div class="empty">No runbooks.</div>')+'</div></div>';
  Array.prototype.forEach.call(v.querySelectorAll("[data-edit]"),function(b){b.onclick=function(){editRunbook(b.getAttribute("data-edit"));};});
}
function editRunbook(id){var r=runbooks.filter(function(x){return x.id===id;})[0];if(!r)return;openModal("Edit runbook · "+r.service);
  document.getElementById("modalBody").innerHTML='<div class="field"><label>Auto-remediation safe</label><div><span class="sw'+(r.auto_safe?' on':'')+'" id="rb-safe"></span> <span style="color:var(--muted);font-size:12px;margin-left:8px">when on, the AI may fix this service without a human (non-critical only)</span></div></div><div class="field"><label>Runbook (markdown)</label><textarea id="rb-content" style="min-height:340px;font-family:var(--mono);font-size:12.5px;line-height:1.6">'+esc(r.content||"")+'</textarea></div><div style="display:flex;gap:9px;margin-top:6px"><button class="btn primary" id="rb-save">Save runbook</button><button class="btn" onclick="closeModal()">Cancel</button></div>';
  var safe=r.auto_safe;document.getElementById("rb-safe").onclick=function(){safe=!safe;this.classList.toggle("on",safe);};
  document.getElementById("rb-save").onclick=async function(){try{await client.records.update("runbooks",id,{content:document.getElementById("rb-content").value,auto_safe:safe});await loadRunbookSafe();closeModal();toast("Runbook saved","ok");render();}catch(e){toast("Failed: "+(e&&e.message),"err");}};}

/* ================= ALERTS ================= */
function renderAlerts(){
  var v=document.getElementById("view");
  document.getElementById("tbActions").innerHTML='<button class="btn" id="testBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 3 3 9-3 9 19-9Z"/><path d="M6 12h16"/></svg>Send test</button><button class="btn primary" id="sendStats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>Send daily stats</button>';
  document.getElementById("sendStats").onclick=sendStatsNow; document.getElementById("testBtn").onclick=sendTest;
  var pid=alertScope==="all"?null:alertScope;
  var scopeOpts='<option value="all">All projects</option>'+projects.map(function(p){return '<option value="'+p.id+'"'+(alertScope===p.id?' selected':'')+'>'+esc(p.emoji+" "+p.name)+'</option>';}).join("");
  var rowsHtml=ALERT_EVENTS.map(function(e){function cell(ch){var on=eventEnabled(ch,e.ev,pid);return '<td class="c"><div class="sw'+(on?' on':'')+'" data-ch="'+ch+'" data-ev="'+e.ev+'"></div></td>';}var tgt=(e.ev==="delegation_agent"||e.ev==="delegation_human")?('<td><input data-tev="'+e.ev+'" placeholder="channel id (optional)" value="'+esc(eventTarget("slack",e.ev,pid)||"")+'" style="width:150px;font-size:12px"></td>'):'<td><span class="evd">default channel</span></td>';return '<tr><td><b>'+esc(e.label)+'</b><div class="evd">'+esc(e.desc)+'</div></td>'+cell("slack")+cell("telegram")+tgt+'</tr>';}).join("");
  var chStatus=notif.map(function(r){return '<span class="chip">'+esc(r.label||r.channel)+': '+(r.enabled?"on":"off")+'</span>';}).join(" ");
  v.innerHTML='<div class="card"><div class="h">Notification rules <span class="count">choose exactly what pings Slack / Telegram</span><select id="scopeSel" style="margin-left:auto">'+scopeOpts+'</select></div><table class="amx"><thead><tr><th>Event</th><th class="c">Slack</th><th class="c">Telegram</th><th>Route to channel</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>'+
    '<div class="card"><div class="h">Channels, routing & schedule</div><div style="padding:16px 17px"><div style="margin-bottom:10px">Connected: '+chStatus+'</div><div class="evd" style="line-height:1.6">• <b>Agent-</b> and <b>human-delegation</b> events can post to dedicated Slack channels — put a channel ID in the “Route to channel” box (blank = default escalations channel).<br>• The <b>daily digest</b> runs on a 09:00 cron (Lemma schedule) and via <b>Send daily stats</b>.<br>• <b>Send test</b> posts a live check to every enabled channel.</div></div></div>';
  document.getElementById("scopeSel").onchange=function(){alertScope=this.value;render();};
  Array.prototype.forEach.call(v.querySelectorAll(".sw"),function(sw){sw.onclick=function(){toggleRule(sw.getAttribute("data-ch"),sw.getAttribute("data-ev"),pid,sw);};});
  Array.prototype.forEach.call(v.querySelectorAll("[data-tev]"),function(inp){inp.onchange=function(){setRuleTarget(inp.getAttribute("data-tev"),pid,inp.value.trim());};});
}
async function toggleRule(ch,ev,pid,sw){if(sw.classList.contains("busy"))return;sw.classList.add("busy");var next=!eventEnabled(ch,ev,pid);try{var exist=alertRules.filter(function(r){return r.channel===ch&&r.event===ev&&(r.project_id===pid||(!r.project_id&&!pid));})[0];if(exist)await client.records.update("alert_rules",exist.id,{enabled:next});else await client.records.create("alert_rules",{project_id:pid,channel:ch,event:ev,enabled:next,label:pid?(pById(pid)||{}).name:"all projects"});await loadAll();sw.classList.toggle("on",next);toast((next?"On":"Off")+": "+ev+" → "+ch,next?"ok":"");}catch(e){toast("Failed","err");}finally{sw.classList.remove("busy");}}
async function setRuleTarget(ev,pid,target){try{for(var c=0;c<2;c++){var ch=["slack","telegram"][c];var exist=alertRules.filter(function(r){return r.channel===ch&&r.event===ev&&(r.project_id===pid||(!r.project_id&&!pid));})[0];if(exist)await client.records.update("alert_rules",exist.id,{target:target||null});else await client.records.create("alert_rules",{project_id:pid,channel:ch,event:ev,enabled:true,target:target||null,label:"routing"});}await loadAll();toast("Routing saved","ok");}catch(e){toast("Failed","err");}}
function connSend(text){var sent=0;notif.forEach(function(r){if(r.enabled!==true||!r.auth_config||!r.send_operation)return;var target=r.incidents_target||r.escalations_target;if(!target)return;var payload={body:{}};payload.body[r.target_field||"channel"]=target;payload.body.text=text;try{client.connectors.operations.execute({organizationId:ORG_ID,authConfigName:r.auth_config},r.send_operation,payload,r.account_id||undefined).catch(function(){});sent++;}catch(e){}});return sent;}
async function sendTest(){var n=connSend(":wave: *oncall test* — notifications are wired up correctly.");toast("Test sent to "+n+" channel"+(n!==1?"s":""),"ok");}
async function sendStatsNow(){var m=metrics();var msg=":bar_chart: *oncall — incident digest*\n*Incidents:* "+m.total+" total · "+m.active+" active · "+m.resolved+" resolved\n*Avg time-to-resolve:* "+mttrStr(m.mttr)+"   *Auto-resolved:* "+m.autoRate+"%\n*Awaiting approval:* "+m.pend+"   *Eng-hours saved:* "+m.hoursSaved.toFixed(1);var sent=0;notif.forEach(function(r){if(r.enabled!==true||!r.auth_config||!r.send_operation)return;if(!eventEnabled(r.channel,"daily_stats",null))return;var target=eventTarget(r.channel,"daily_stats",null)||r.incidents_target||r.escalations_target;if(!target)return;var payload={body:{}};payload.body[r.target_field||"channel"]=target;payload.body.text=msg;try{client.connectors.operations.execute({organizationId:ORG_ID,authConfigName:r.auth_config},r.send_operation,payload,r.account_id||undefined).catch(function(){});sent++;}catch(e){}});toast("Daily stats sent to "+sent+" channel"+(sent!==1?"s":""),"ok");}

/* ================= modal ================= */
function openModal(t){document.getElementById("modalTitle").textContent=t;document.getElementById("modal").classList.add("open");}
function closeModal(){document.getElementById("modal").classList.remove("open");}
document.getElementById("modal").addEventListener("click",function(e){if(e.target.id==="modal")closeModal();});
function viewMarkdown(t,md){openModal(t);document.getElementById("modalBody").innerHTML='<div class="md">'+(md?mdToHtml(md):'<div class="empty">No content.</div>')+'</div>';}
async function viewRunbook(service){openModal("Runbook · "+service);document.getElementById("modalBody").innerHTML='<div class="skel">Loading…</div>';try{var rows=(await client.records.list("runbooks",{limit:1,filters:[{field:"service",op:"eq",value:service}]})).items||[];if(!rows.length){document.getElementById("modalBody").innerHTML='<div class="empty">No runbook for <b>'+esc(service)+'</b>.</div>';return;}var r=rows[0];document.getElementById("modalBody").innerHTML='<div class="md"><div style="margin-bottom:8px"><span class="st '+(r.auto_safe?"st-resolved":"")+'">'+(r.auto_safe?"auto-remediation safe":"human approval required")+'</span></div>'+mdToHtml(r.content||"")+'</div>';}catch(e){document.getElementById("modalBody").innerHTML='<div class="empty">Could not load runbook.</div>';}}
function mdToHtml(md){var lines=md.replace(/\r/g,"").split("\n"),out=[],i=0;function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`(.+?)`/g,"<code>$1</code>");}while(i<lines.length){var l=lines[i];if(/^\s*$/.test(l)){i++;continue;}if(/^#{1,6}\s/.test(l)){var h=l.match(/^#+/)[0].length;out.push("<h"+h+">"+inl(l.replace(/^#+\s/,""))+"</h"+h+">");i++;continue;}if(/^---+$/.test(l)){out.push("<hr>");i++;continue;}if(/^\s*\|.*\|/.test(l)){var tb=[];while(i<lines.length&&/^\s*\|.*\|/.test(lines[i])){tb.push(lines[i]);i++;}var rows=tb.filter(function(r){return !/^\s*\|[\s\-:|]+\|\s*$/.test(r);});out.push("<table>"+rows.map(function(r,ri){var cells=r.split("|").slice(1,-1).map(function(c){return c.trim();});var tag=ri===0?"th":"td";return "<tr>"+cells.map(function(c){return "<"+tag+">"+inl(c)+"</"+tag+">";}).join("")+"</tr>";}).join("")+"</table>");continue;}if(/^\s*[-*]\s/.test(l)){var li=[];while(i<lines.length&&/^\s*[-*]\s/.test(lines[i])){li.push("<li>"+inl(lines[i].replace(/^\s*[-*]\s/,""))+"</li>");i++;}out.push("<ul>"+li.join("")+"</ul>");continue;}var p=[];while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,6}\s|---+$|\s*[-*]\s|\s*\|)/.test(lines[i])){p.push(lines[i]);i++;}out.push("<p>"+inl(p.join(" "))+"</p>");}return out.join("");}
</script>
