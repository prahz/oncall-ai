<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>oncall</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface2:#f2f3f7; --surface3:#eaecf2;
    --border:#e6e8ee; --border2:#dcdfe8;
    --text:#171a21; --muted:#68707e; --dim:#9aa2b1;
    --accent:#6d5efc; --accent-h:#5847f5; --accent-soft:#efedff; --accent-ring:rgba(109,94,252,.25);
    --crit:#f43f5e; --high:#f97316; --med:#6d5efc; --low:#94a3b8;
    --ok:#10b981; --ok-soft:#e6f7f1; --warn:#f59e0b; --warn-soft:#fff5e5;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --shadow-sm:0 1px 2px rgba(20,25,40,.06),0 1px 3px rgba(20,25,40,.05);
    --shadow-md:0 8px 24px rgba(20,25,40,.10);
    --shadow-lg:0 18px 50px rgba(20,25,40,.18);
    --sidebar:240px;
  }
  :root[data-theme="dark"]{
    --bg:#0b0e14; --surface:#12161f; --surface2:#171c27; --surface3:#1f2531;
    --border:#232a37; --border2:#2c3444;
    --text:#e9edf5; --muted:#93a0b4; --dim:#5d6a7e;
    --accent:#8b7dff; --accent-h:#a596ff; --accent-soft:#1c1b3a; --accent-ring:rgba(139,125,255,.3);
    --crit:#ff5d6c; --high:#ff9f43; --med:#8b7dff; --low:#7b8794;
    --ok:#2ee6a6; --ok-soft:#0f2b23; --warn:#ffce4d; --warn-soft:#2a2410;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 10px 30px rgba(0,0,0,.5); --shadow-lg:0 20px 55px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
    background:radial-gradient(820px 460px at 8% -10%,rgba(109,94,252,.13),transparent 60%),radial-gradient(720px 440px at 102% -4%,rgba(56,189,248,.10),transparent 55%),radial-gradient(760px 520px at 50% 118%,rgba(16,185,129,.07),transparent 55%),var(--bg);background-attachment:fixed}
  :root[data-theme="dark"] body{background:radial-gradient(820px 460px at 8% -10%,rgba(139,125,255,.16),transparent 60%),radial-gradient(720px 440px at 102% -4%,rgba(56,189,248,.10),transparent 55%),radial-gradient(760px 520px at 50% 118%,rgba(46,230,166,.08),transparent 55%),var(--bg);background-attachment:fixed}
  a{color:var(--accent);text-decoration:none}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  button{font:inherit;border:0;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;transition:.13s;white-space:nowrap;color:var(--text)}
  button:disabled{opacity:.5;cursor:default}
  input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border2);border-radius:9px;padding:8px 11px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}

  .app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
  .side{background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(18px);border-right:1px solid color-mix(in srgb,var(--border) 80%,transparent);display:flex;flex-direction:column;gap:4px;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 14px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#a06bff);display:grid;place-items:center;box-shadow:0 6px 16px var(--accent-ring);flex:none}
  .logo svg{width:19px;height:19px;color:#fff}
  .brand .nm{font-size:20px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(120deg,var(--text) 30%,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .brand .tag{color:var(--dim);font-size:11px;margin-top:-3px}
  .navitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px}
  .navitem:hover{background:var(--surface2);color:var(--text)}
  .navitem.on{background:var(--accent-soft);color:var(--accent)}
  .navitem svg{width:17px;height:17px;flex:none}
  .navitem .cnt{margin-left:auto;font-size:11px;background:var(--surface3);color:var(--muted);border-radius:20px;padding:1px 8px;font-weight:700}
  .navitem.on .cnt{background:var(--accent);color:#fff}
  .side .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);font-weight:700;padding:16px 12px 6px}
  .live{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12px;color:var(--muted);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2.4s infinite;flex:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}70%{box-shadow:0 0 0 6px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
  .foot{margin-top:auto;padding-top:14px}
  .themeToggle{display:flex;align-items:center;gap:9px;width:100%;background:var(--surface2);border:1px solid var(--border);justify-content:flex-start;color:var(--muted);font-size:12.5px}
  .themeToggle:hover{background:var(--surface3)} .themeToggle svg{width:15px;height:15px}

  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:15px 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .topbar h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.3px}
  .topbar .sub{color:var(--dim);font-size:12px;margin-top:-2px}
  .actions{margin-left:auto;display:flex;gap:9px}
  .btn{background:var(--surface);color:var(--text);border:1px solid var(--border2);display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow-sm)}
  .btn:hover{background:var(--surface2)} .btn.primary{background:linear-gradient(135deg,var(--accent),#8b6bff);border:0;color:#fff;box-shadow:0 6px 16px var(--accent-ring)} .btn.primary:hover{filter:brightness(1.06)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px} .btn svg{width:15px;height:15px}
  .content{padding:20px 24px 30px;display:flex;flex-direction:column;gap:18px}

  .card{background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(16px);border:1px solid color-mix(in srgb,var(--border) 80%,transparent);border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden}
  .card>.h{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:9px}
  .card>.h .count{margin-left:auto;color:var(--dim);font-weight:600;font-size:12px}
  .pill{background:var(--warn);color:#3a2a00;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px}
  :root[data-theme="dark"] .pill{color:#231a00}

  .menu-wrap{position:relative}
  .menu{position:absolute;right:0;top:calc(100% + 8px);width:350px;background:var(--surface);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow-lg);padding:7px;z-index:40;display:none;max-height:70vh;overflow:auto}
  .menu.open{display:block;animation:pop .13s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
  .menu .mh{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);font-weight:700;padding:9px 10px 5px}
  .mi{display:flex;gap:11px;align-items:flex-start;padding:9px 10px;border-radius:10px;cursor:pointer}
  .mi:hover{background:var(--surface2)} .mi .em{font-size:15px;flex:none;width:20px;text-align:center;margin-top:1px}
  .mi .t{font-weight:600;font-size:13px} .mi .d{color:var(--muted);font-size:11.5px;margin-top:1px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .kpi{background:color-mix(in srgb,var(--surface) 76%,transparent);backdrop-filter:blur(16px);border:1px solid color-mix(in srgb,var(--border) 80%,transparent);border-radius:16px;padding:16px 17px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:.16s}
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 30%,transparent),transparent)}
  .kpi .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;margin-bottom:10px} .kpi .ic svg{width:16px;height:16px}
  .kpi .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1} .kpi .l{color:var(--muted);font-size:12px;margin-top:4px;font-weight:500}
  .kpi.acc .ic{background:var(--accent-soft);color:var(--accent)} .kpi.acc .n{color:var(--accent)}
  .kpi.warn .ic{background:var(--warn-soft);color:var(--warn)} .kpi.warn .n{color:var(--warn)}
  .kpi.ok .ic{background:var(--ok-soft);color:var(--ok)} .kpi.ok .n{color:var(--ok)}

  /* sandbox */
  .prail{display:flex;gap:12px;flex-wrap:wrap}
  .pcard{background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:15px;padding:14px 16px;min-width:210px;cursor:pointer;transition:.13s;display:flex;gap:12px;align-items:flex-start}
  .pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)} .pcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
  .pcard .pe{font-size:22px} .pcard .pn{font-weight:700} .pcard .pp{font-size:11px;color:var(--dim);margin-top:1px} .pcard .pd{font-size:11.5px;color:var(--muted);margin-top:4px}
  .pcard.add{align-items:center;justify-content:center;color:var(--muted);border-style:dashed;font-weight:600}
  .prov{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:6px;background:var(--surface3);color:var(--muted)}
  .run{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);font-size:13px}
  .run:last-child{border-bottom:0}
  .run .rs{width:9px;height:9px;border-radius:50%;flex:none}
  .rs.passing,.rs.fixed{background:var(--ok)} .rs.failing{background:var(--crit)} .rs.running{background:var(--warn);animation:pulse 1.6s infinite}
  .run .rnum{font-family:var(--mono);color:var(--dim);font-size:11.5px;min-width:44px}
  .run .rmsg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .run .rmeta{color:var(--dim);font-size:11px;font-family:var(--mono)}
  .rbadge{font-size:10px;font-weight:800;letter-spacing:.3px;padding:3px 8px;border-radius:6px;text-transform:uppercase}
  .rbadge.passing,.rbadge.fixed{background:var(--ok-soft);color:var(--ok)} .rbadge.failing{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)} .rbadge.running{background:var(--warn-soft);color:var(--warn)}

  .grid{display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1.25fr);gap:18px}
  .tabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface2)}
  .tab{font-size:12px;font-weight:600;color:var(--muted);padding:5px 11px;border-radius:8px;cursor:pointer}
  .tab:hover{background:var(--surface3)} .tab.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}
  .feed{max-height:60vh;overflow:auto}
  .inc{display:flex;align-items:center;gap:11px;padding:13px 18px;border-bottom:1px solid var(--border);cursor:pointer;border-left:3px solid transparent;transition:.1s}
  .inc:hover{background:var(--surface2)} .inc.sel{background:var(--accent-soft);border-left-color:var(--accent)}
  .inc .num{font-family:var(--mono);color:var(--dim);font-size:11.5px;min-width:50px} .inc .ti{flex:1;min-width:0}
  .inc .ti .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600} .inc .svc2{color:var(--muted);font-size:11.5px;margin-top:1px}
  .badge{font-size:10px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
  .b-critical{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)} .b-high{background:color-mix(in srgb,var(--high) 16%,transparent);color:var(--high)} .b-medium{background:var(--accent-soft);color:var(--med)} .b-low{background:color-mix(in srgb,var(--low) 20%,transparent);color:var(--low)}
  .st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid var(--border2);color:var(--muted);text-transform:capitalize;white-space:nowrap}
  .st-resolved,.st-pushed,.st-solved{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
  .st-mitigating,.st-triaging,.st-detected,.st-working,.st-queued{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-soft)}
  .st-rejected,.st-failed{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}

  .appr{padding:16px 18px;border-bottom:1px solid var(--border)} .appr:last-child{border-bottom:0}
  .appr .top{display:flex;align-items:center;gap:9px;margin-bottom:9px} .appr h3{margin:0;font-size:14px;font-weight:700;flex:1}
  .appr .kv{display:grid;grid-template-columns:92px 1fr;gap:5px 12px;margin:9px 0;font-size:13px} .appr .kv .k{color:var(--dim)}
  .appr .fix{background:var(--accent-soft);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:10px 13px;font-size:13px;margin:10px 0}
  .appr .gate{font-size:12px;color:var(--warn);background:var(--warn-soft);border:1px solid var(--border);border-radius:9px;padding:8px 11px;margin:8px 0}
  .appr .acts{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap}
  .approve{background:var(--ok);color:#fff;box-shadow:0 5px 14px rgba(16,185,129,.28)} .approve:hover{filter:brightness(1.05)}
  .reject{background:transparent;color:var(--crit);border:1px solid color-mix(in srgb,var(--crit) 45%,transparent)} .reject:hover{background:color-mix(in srgb,var(--crit) 12%,transparent)}
  .agentbtn{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-ring)} .agentbtn:hover{background:var(--accent);color:#fff}
  .humanbtn{background:var(--surface2);color:var(--text);border:1px solid var(--border2)} .humanbtn:hover{background:var(--surface3)}
  .empty{padding:34px 18px;text-align:center;color:var(--dim);font-size:13px} .skel{padding:18px;color:var(--dim);font-size:13px}

  .det .kv{display:grid;grid-template-columns:118px 1fr;gap:8px 14px;padding:16px 18px;font-size:13px} .det .kv .k{color:var(--dim)}
  .det .sec{padding:15px 18px;border-top:1px solid var(--border)} .det .sec h4{margin:0 0 11px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  .gauge .top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px} .gauge .sc{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums} .gauge .of{color:var(--dim);font-size:12px}
  .gauge .bar{height:10px;border-radius:6px;background:var(--surface3);overflow:hidden} .gauge .fill{height:100%;border-radius:6px;transition:width .5s ease}
  .gauge .brk{margin-top:10px;display:flex;flex-direction:column;gap:4px} .gauge .brk div{font-size:11.5px;color:var(--muted);padding-left:14px;position:relative} .gauge .brk div::before{content:"›";position:absolute;left:0;color:var(--dim)}
  .linkrow{display:flex;gap:9px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:7px 12px;font-size:12.5px;color:var(--text);cursor:pointer} .chip:hover{border-color:var(--accent);color:var(--accent)}
  .tl{position:relative;margin-left:6px;padding-left:18px} .tl::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--border2)}
  .tl .ev{position:relative;padding:5px 0 12px} .tl .ev::before{content:"";position:absolute;left:-18px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 2px var(--border2)}
  .tl .ev.done::before{background:var(--ok)} .tl .ev.warnd::before{background:var(--warn)} .tl .ev.critd::before{background:var(--crit)}
  .tl .et{font-size:13px} .tl .em2{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:1px}

  /* delegations */
  .dcol{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .dcolh{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .dcard{background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:14px;padding:14px 15px;margin-bottom:12px}
  .dcard .dt{font-weight:700;font-size:13.5px;margin-bottom:3px} .dcard .dm{color:var(--muted);font-size:12px;margin-bottom:8px}
  .dcard .who{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:8px}
  .who.agent{background:var(--accent-soft);color:var(--accent)} .who.human{background:var(--surface3);color:var(--text)}
  .dcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

  /* alerts matrix */
  .amx{width:100%;border-collapse:collapse} .amx th,.amx td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
  .amx th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);font-weight:700} .amx td.c{text-align:center}
  .amx .evd{color:var(--muted);font-size:11.5px}
  .sw{position:relative;width:38px;height:21px;border-radius:20px;background:var(--surface3);border:1px solid var(--border2);cursor:pointer;transition:.15s;flex:none;display:inline-block;vertical-align:middle}
  .sw::after{content:"";position:absolute;top:1px;left:1px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:.15s} .sw.on{background:var(--ok)} .sw.on::after{transform:translateX(17px)} .sw.busy{opacity:.5}

  .modal{position:fixed;inset:0;background:rgba(15,20,32,.5);backdrop-filter:blur(5px);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
  .modal.open{display:flex;animation:pop .15s ease}
  .modal .mcard{background:var(--surface);border:1px solid var(--border2);border-radius:18px;max-width:860px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
  .modal .mhd{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--border)} .modal .mhd h3{margin:0;font-size:15px;font-weight:700;flex:1}
  .modal .x{background:var(--surface2);border:1px solid var(--border2);width:32px;height:32px;padding:0;border-radius:9px;color:var(--muted);font-size:16px}
  .modal .mbody{padding:8px 24px 24px;overflow:auto}
  .logbox{background:#0b0e14;color:#c9d4e3;border-radius:12px;padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;overflow:auto;max-height:60vh;border:1px solid #232a37}
  .logbox .er{color:#ff6b7a} .logbox .wn{color:#ffce4d} .logbox .ok{color:#37e0a6}
  .field{display:flex;flex-direction:column;gap:5px;margin:12px 0} .field label{font-size:12px;color:var(--muted);font-weight:600}
  .md h1,.md h2,.md h3{margin:18px 0 8px;font-weight:700}.md h1{font-size:20px}.md h2{font-size:16px}.md h3{font-size:14px}
  .md p{margin:8px 0}.md ul{margin:8px 0;padding-left:20px}.md li{margin:3px 0}.md code{background:var(--surface2);padding:1px 6px;border-radius:5px;font-family:var(--mono);font-size:12.5px}
  .md table{border-collapse:collapse;margin:10px 0;width:100%}.md th,.md td{border:1px solid var(--border2);padding:6px 10px;font-size:12.5px;text-align:left}.md th{background:var(--surface2)}.md hr{border:0;border-top:1px solid var(--border);margin:14px 0}.md strong{color:var(--text);font-weight:700}

  .toast{position:fixed;bottom:24px;left:calc(50% + var(--sidebar)/2);transform:translateX(-50%) translateY(10px);background:var(--surface);border:1px solid var(--border2);padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transition:.22s;pointer-events:none;z-index:80}

async function boot(){

    var seedRuns=[[p1,[["feat: wishlist share","a1b2c3d"],["chore: bump deps","b2c3d4e"],["fix: cart totals rounding","c3d4e5f"]]],[p2,[["feat: idempotency keys","d4e5f6a"],["test: refund path","e5f6a7b"],["chore: upgrade node 20","f6a7b8c"]]]];

function viewLogs(runId){var r=ciRuns.filter(function(x){return x.id===runId;})[0];if(!r)return;openModal("Logs · "+(r.pipeline||"")+" #"+(r.run_number||""));

/* ============ triage + notify ============ */
function triage(sev,blast,conf){var brk=[];var sp={critical:50,high:30,medium:15,low:5};var s=sp[sev]!=null?sp[sev]:15;brk.push("severity "+sev+" = +"+s);var score=s;var bp={single_service:0,multi_service:15,infrastructure:30};var b=bp[blast]||0;if(b){brk.push("blast radius "+blast+" = +"+b);}score+=b;var h=new Date().getUTCHours();if(h>=0&&h<=6){brk.push("off-hours (00:00–06:00 UTC) = +10");score+=10;}if(conf<0.6){brk.push("low confidence ("+Math.round(conf*100)+"%) adds risk = +10");score+=10;}score=Math.max(0,Math.min(100,score));var band=score>=70?"critical":score>=45?"high":score>=25?"medium":"low";var order=["low","medium","high","critical"];var final=order[Math.max(order.indexOf(sev),order.indexOf(band))];brk.push("score "+score+"/100 → band "+band+"; final = max("+sev+", "+band+") = "+final);return {score:score,reason:brk.join(" · "),final:final};}

function ruleFor(channel,event,projectId){var m=alertRules.filter(function(r){return r.channel===channel&&r.event===event&&(r.project_id===projectId||!r.project_id);});return m;}
function eventEnabled(channel,event,projectId){var m=ruleFor(channel,event,projectId);if(!m.length)return true;return m.some(function(r){return r.enabled;});}
function eventTarget(channel,event,projectId){var m=ruleFor(channel,event,projectId);var t=m.filter(function(r){return r.target;})[0];return t?t.target:null;}
var ESC_DEFAULT={manual_approval:1,escalation:1,delegation_agent:1,delegation_human:1};
function slackText(event,inc){var num=inc.number,title=inc.title||"incident",svc=inc.service||"unknown",sev=(inc.severity||"").toUpperCase(),conf=inc.confidence!=null?Math.round(inc.confidence*100)+"%":"—",head="INC-"+num+" · "+title,dash="<"+window.location.origin+"|Open the oncall dashboard →>";
  if(event==="manual_approval")return ":rotating_light: *Approval needed — "+head+"*\n*Service:* "+svc+"   *Severity:* "+sev+"   *Confidence:* "+conf+"\n*Root cause:* "+(inc.root_cause||"—")+"\n*Proposed fix:* "+(inc.suggested_fix||"—")+"\n*Approve / reject:* "+dash;
  if(event==="escalation")return ":warning: *Escalation — "+head+"*\n*Service:* "+svc+"   *Severity:* "+sev+"\nAutomated remediation did not hold — a human is needed.";
  if(event==="delegation_agent")return ":robot_face: *Agent delegation — "+head+"*\nThe fix ("+(inc.suggested_fix||"remediation")+") was handed to the AI agent. It will patch and open a PR.";
  if(event==="delegation_human")return ":bust_in_silhouette: *Human delegation — "+head+"*\nAssigned to on-call. Please review & push the fix: "+dash;
  if(event==="rejected")return ":no_entry: *Rejected — "+head+"*\nRemediation was rejected and escalated to a human.";
  return ":white_check_mark: *Resolved & pushed — "+head+"*\n*Service:* "+svc+"\n*Fix:* "+(inc.suggested_fix||"—")+"  → pushed to "+(inc._branch||"main");}
async function notifyChannels(event,inc,projectId){try{var text=slackText(event,inc);
  notif.forEach(function(r){if(r.enabled!==true||!r.auth_config||!r.send_operation)return;var ch=r.channel;
    if(!eventEnabled(ch,event,projectId))return;
    var target=eventTarget(ch,event,projectId)||(ESC_DEFAULT[event]?(r.escalations_target||r.incidents_target):(r.incidents_target||r.escalations_target));
    if(!target)return;var payload={body:{}};payload.body[r.target_field||"channel"]=target;payload.body.text=text;
    try{client.connectors.operations.execute({organizationId:ORG_ID,authConfigName:r.auth_config},r.send_operation,payload,r.account_id||undefined).catch(function(){});}catch(e){}
  });}catch(e){}}

async function simulateFailure(i){
  if(busy)return;busy=true;
  var sc=SCEN[i],pid=selectedProject,proj=pById(pid);
  try{
    var autoSafe=(runbookSafe[sc.service]!==undefined)?runbookSafe[sc.service]:(["api-gateway","image-processing-worker","automated-service"].indexOf(sc.service)>=0);
    var tri=triage(sc.severity,sc.blast,sc.confidence);
    var autoOk=autoSafe&&sc.confidence>=0.85&&tri.final!=="critical"&&sc.blast!=="infrastructure";
    var sha=Math.random().toString(16).slice(2,9);
    var run=await client.records.create("ci_runs",{project_id:pid,pipeline:sc.pipeline,run_number:140+Math.floor(Math.random()*60),ref:"main",commit_sha:sha,commit_msg:sc.title,status:"failing",stage:sc.stage,service:sc.service,error_signature:sc.err,logs:sc.logs});
    var alertObj={message:sc.err+" — "+sc.stage,source:proj?proj.provider:"ci",severity:sc.severity,metric:sc.stage,created_at:nowISO()};
    var inc=await client.records.create("incidents",{title:sc.title,service:sc.service,severity:tri.final,status:"triaging",blast_radius:sc.blast,root_cause:sc.root,confidence:sc.confidence,suggested_fix:sc.fix,suspect_deploy:sc.suspect,affected_services:[sc.service],triggering_alerts:[alertObj],triage_score:tri.score,triage_reason:tri.reason,heal_attempts:0,project_id:pid,ci_run_id:run.id});
    await client.records.update("ci_runs",run.id,{incident_id:inc.id});
    await client.records.create("remediation_actions",{incident_id:inc.id,action_type:sc.action,description:sc.fix,confidence:sc.confidence,auto_approved:autoOk,status:autoOk?"approved":"pending_approval",executed_by:autoOk?"agent":null,result:autoOk?null:("Gated: "+(autoSafe?"":"runbook not auto-safe; ")+(tri.final==="critical"?"critical severity; ":"")+"needs human approval")});
    selectedIncident=inc.id;
    toast("INC-"+inc.number+" opened from "+(proj?proj.name:"CI")+" · "+(autoOk?"auto-remediating":"needs approval"),autoOk?"ok":"");
    await loadAll();
    if(autoOk){ await sleep(900); await client.records.update("incidents",inc.id,{status:"mitigating",mitigated_at:nowISO()}); await loadAll(); if(tab!=="sandbox")render();
      var d=await createDelegation(inc,run,"agent"); await runAgent(d.id);
    }else{ notifyChannels("manual_approval",inc,pid); }
    if(tab==="sandbox"||tab==="incidents")render();
  }catch(e){toast("Failed: "+(e&&e.message),"err");}
  finally{busy=false;}
}
async function createDelegation(inc,run,type){
  return await client.records.create("delegations",{incident_id:inc.id,project_id:inc.project_id,ci_run_id:inc.ci_run_id||(run&&run.id),title:inc.title,assignee_type:type||"agent",assignee:type==="human"?"":"",status:"queued",summary:inc.suggested_fix});
}
async function runAgent(delId){
  var d=await client.records.get("delegations",delId);
  var inc=await client.records.get("incidents",d.incident_id);

  notifyChannels("delegation_agent",inc,inc.project_id); await loadAll(); if(tab==="delegations"||tab==="sandbox")render();
  await sleep(1600);
  await client.records.update("delegations",delId,{status:"solved",notes:"agent patched "+inc.service+" and validated the fix"}); await loadAll(); if(tab==="delegations")render();

async function assignAgentManual(delId){ if(busy)return;busy=true; try{ await runAgent(delId); }catch(e){toast("Failed","err");} finally{busy=false;} }
async function pushFix(delId,by){
  var d=await client.records.get("delegations",delId);
  var inc=await client.records.get("incidents",d.incident_id);
  var proj=pById(inc.project_id);
  var pr=(proj?proj.repo_url:"")+"/pull/"+(1000+Math.floor(Math.random()*8999));
  inc._branch=proj?proj.default_branch:"main";
  await client.records.update("delegations",delId,{status:"pushed",pr_url:pr,assignee:by,notes:"pushed fix to "+(proj?proj.default_branch:"main")});
  var acts=(await client.records.list("remediation_actions",{limit:5,filters:[{field:"incident_id",op:"eq",value:inc.id}],sort:[{field:"created_at",direction:"desc"}]})).items||[];
  await resolveIncident(inc,acts[0],"fix delegated to "+by+" and pushed to "+(proj?proj.default_branch:"main"),by);
  if(inc.ci_run_id){try{await client.records.update("ci_runs",inc.ci_run_id,{status:"fixed"});}catch(e){}}
  notifyChannels("incident_resolved",inc,inc.project_id);
  await loadAll(); render();
}
async function resolveIncident(inc,action,resultText,by){
  var t=nowISO();
  if(action){try{await client.records.update("remediation_actions",action.id,{status:"executed",executed_by:by||"agent",result:resultText});}catch(e){}}
  var full=await client.records.get("incidents",inc.id);
  var md=postmortemMd(full,action,resultText,t);
  await client.records.update("incidents",inc.id,{status:"resolved",resolved_at:t,mitigated_at:full.mitigated_at||t,postmortem_md:md});
  writePostmortemFile(full.number,md,inc.id); appendRunbookLesson(full);
}
function postmortemMd(inc,action,resultText,resolvedAt){var al=(inc.triggering_alerts&&inc.triggering_alerts[0])||{};var n=inc.number,act=(action&&action.action_type)||"remediation",proj=pById(inc.project_id);
  return "# INC-"+n+": "+(inc.title||"Incident")+"\n\n**Project:** "+(proj?proj.name:"—")+"  ·  **Service:** "+inc.service+"  ·  **Severity:** "+inc.severity+"  ·  **Blast radius:** "+(inc.blast_radius||"single_service")+"\n**Duration:** "+fmt(inc.created_at)+" → "+fmt(resolvedAt)+"\n\n## Summary\n"+(inc.root_cause||"")+" The AI applied `"+act+"`, the health re-check passed, and the fix was pushed to the repo.\n\n## Timeline\n- "+fmt(al.created_at||inc.created_at)+" — CI failure: "+(al.message||"pipeline failed")+"\n- "+fmt(resolvedAt)+" — "+act+": "+(resultText||"applied")+"\n- "+fmt(resolvedAt)+" — incident resolved & pushed\n\n## Root cause\n"+(inc.root_cause||"—")+(inc.suspect_deploy&&inc.suspect_deploy!=="unknown"?(" Suspect deploy: `"+inc.suspect_deploy+"`."):"")+"\n\n## What worked\n"+(inc.suggested_fix||"The remediation")+" resolved the incident; automated health re-check confirmed recovery.\n\n## Lessons learned\n- The runbook for `"+inc.service+"` matched this signature — triage and fix were unambiguous.\n- Triage scored this "+inc.triage_score+"/100 ("+(inc.severity==="critical"?"human approval required":"safe to auto-remediate")+").\n\n## Action items\n- [ ] Confirm the fix held over the next few hours.\n- [ ] Add a regression test for this signature in `"+inc.service+"`.\n";}
async function writePostmortemFile(number,md,incId){try{var file=new File([md],"INC-"+number+".md",{type:"text/markdown"});await client.files.upload(file,{directoryPath:"/postmortems",searchEnabled:false});await client.records.update("incidents",incId,{postmortem_path:"/postmortems/INC-"+number+".md"});}catch(e){}}
async function appendRunbookLesson(inc){try{var rows=(await client.records.list("runbooks",{limit:1,filters:[{field:"service",op:"eq",value:inc.service}]})).items||[];if(!rows.length)return;var rb=rows[0];if((rb.content||"").indexOf("INC-"+inc.number+" (")>=0)return;var entry="\n\n## Incident log — INC-"+inc.number+" ("+fmt(inc.resolved_at||nowISO())+")\n- **What happened:** "+(inc.title||"incident")+"\n- **What fixed it:** "+(inc.suggested_fix||"remediation")+"\n- **Lesson:** Signature matched the runbook; triage scored "+inc.triage_score+"/100.\n";await client.records.update("runbooks",rb.id,{content:(rb.content||"")+entry});}catch(e){}}

function renderAlerts(){
  var v=document.getElementById("view");
  document.getElementById("tbActions").innerHTML='<button class="btn primary" id="sendStats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg>Send daily stats now</button>';
  document.getElementById("sendStats").onclick=sendStatsNow;
  var scopeOpts='<option value="all">All projects</option>'+projects.map(function(p){return '<option value="'+p.id+'"'+(alertScope===p.id?' selected':'')+'>'+esc(p.emoji+" "+p.name)+'</option>';}).join("");
  var pid=alertScope==="all"?null:alertScope;
  var rowsHtml=ALERT_EVENTS.map(function(e){
    function cell(ch){var on=eventEnabled(ch,e.ev,pid);return '<td class="c"><div class="sw'+(on?' on':'')+'" data-ch="'+ch+'" data-ev="'+e.ev+'"></div></td>';}
    var tgt=(e.ev==="delegation_agent"||e.ev==="delegation_human")?('<td><input data-tev="'+e.ev+'" placeholder="channel id (optional)" value="'+esc(eventTarget("slack",e.ev,pid)||"")+'" style="width:160px;font-size:12px"></td>'):'<td></td>';
    return '<tr><td><b>'+esc(e.label)+'</b><div class="evd">'+esc(e.desc)+'</div></td>'+cell("slack")+cell("telegram")+tgt+'</tr>';
  }).join("");
  var chStatus=notif.map(function(r){return '<span class="chip">'+esc(r.label||r.channel)+': '+(r.enabled?"on":"off")+'</span>';}).join(" ");
  v.innerHTML='<div class="card"><div class="h">Notification rules <span class="count">choose what pings Slack / Telegram</span>'+
    '<select id="scopeSel" style="margin-left:auto">'+scopeOpts+'</select></div>'+
    '<table class="amx"><thead><tr><th>Event</th><th class="c">Slack</th><th class="c">Telegram</th><th>Route to channel</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>'+
    '<div class="card"><div class="h">Channels & delegation routing</div><div style="padding:16px 18px">'+
    '<div style="margin-bottom:10px">Connected: '+chStatus+'</div>'+
    '<div class="evd">Agent-delegation and human-delegation events can post to dedicated Slack channels — put a channel ID in the “Route to channel” box above (leave blank to use the default escalations channel). The daily digest runs on a 09:00 cron and via the button above.</div>'+
    '</div></div>';
  document.getElementById("scopeSel").onchange=function(){alertScope=this.value;render();};
  Array.prototype.forEach.call(v.querySelectorAll(".sw"),function(sw){sw.onclick=function(){toggleRule(sw.getAttribute("data-ch"),sw.getAttribute("data-ev"),pid,sw);};});
  Array.prototype.forEach.call(v.querySelectorAll("[data-tev]"),function(inp){inp.onchange=function(){setRuleTarget(inp.getAttribute("data-tev"),pid,inp.value.trim());};});
}
async function toggleRule(channel,event,pid,sw){
  if(sw.classList.contains("busy"))return;sw.classList.add("busy");
  var cur=eventEnabled(channel,event,pid);var next=!cur;
  try{var exist=alertRules.filter(function(r){return r.channel===channel&&r.event===event&&(r.project_id===pid||(!r.project_id&&!pid));})[0];
    if(exist)await client.records.update("alert_rules",exist.id,{enabled:next});
    else await client.records.create("alert_rules",{project_id:pid,channel:channel,event:event,enabled:next,label:pid?(pById(pid)||{}).name:"all projects"});
    await loadAll();sw.classList.toggle("on",next);toast((next?"On":"Off")+": "+event+" → "+channel,next?"ok":"");
  }catch(e){toast("Failed: "+(e&&e.message),"err");}finally{sw.classList.remove("busy");}
}
async function setRuleTarget(event,pid,target){try{
  ["slack","telegram"].forEach(async function(ch){var exist=alertRules.filter(function(r){return r.channel===ch&&r.event===event&&(r.project_id===pid||(!r.project_id&&!pid));})[0];
    if(exist)await client.records.update("alert_rules",exist.id,{target:target||null});
    else await client.records.create("alert_rules",{project_id:pid,channel:ch,event:event,enabled:true,target:target||null,label:"routing"});});
  await loadAll();toast("Routing saved","ok");
}catch(e){toast("Failed","err");}}
async function sendStatsNow(){
  var b=document.getElementById("sendStats");b.disabled=true;
  try{
    var by={};incidents.forEach(function(i){by[i.status]=(by[i.status]||0)+1;});
    var active=(by.detected||0)+(by.triaging||0)+(by.mitigating||0),resolved=(by.resolved||0);
    var pushed=delegations.filter(function(d){return d.status==="pushed";}).length,working=delegations.filter(function(d){return ["queued","working"].indexOf(d.status)>=0;}).length;
    var pend=incidents.filter(function(i){return i._await;}).length;
    var msg=":bar_chart: *oncall — incident digest*\n*Incidents:* "+incidents.length+" total · "+active+" active · "+resolved+" resolved\n*Awaiting approval:* "+pend+"\n*Delegations:* "+working+" in progress · "+pushed+" pushed to repo";
    var sent=0;
    notif.forEach(function(r){if(r.enabled!==true||!r.auth_config||!r.send_operation)return;if(!eventEnabled(r.channel,"daily_stats",null))return;var target=eventTarget(r.channel,"daily_stats",null)||r.incidents_target||r.escalations_target;if(!target)return;var payload={body:{}};payload.body[r.target_field||"channel"]=target;payload.body.text=msg;try{client.connectors.operations.execute({organizationId:ORG_ID,authConfigName:r.auth_config},r.send_operation,payload,r.account_id||undefined).catch(function(){});sent++;}catch(e){}});
    toast("Daily stats sent to "+sent+" channel"+(sent!==1?"s":""),"ok");
  }catch(e){toast("Failed: "+(e&&e.message),"err");}finally{b.disabled=false;}
}

/* ============ modal / docs ============ */
function openModal(t){document.getElementById("modalTitle").textContent=t;document.getElementById("modal").classList.add("open");}
function closeModal(){document.getElementById("modal").classList.remove("open");}
document.getElementById("modal").addEventListener("click",function(e){if(e.target.id==="modal")closeModal();});
function viewMarkdown(t,md){openModal(t);document.getElementById("modalBody").innerHTML='<div class="md">'+(md?mdToHtml(md):'<div class="empty">No content.</div>')+'</div>';}
async function viewRunbook(service){openModal("Runbook · "+service);document.getElementById("modalBody").innerHTML='<div class="skel">Loading…</div>';try{var rows=(await client.records.list("runbooks",{limit:1,filters:[{field:"service",op:"eq",value:service}]})).items||[];if(!rows.length){document.getElementById("modalBody").innerHTML='<div class="empty">No runbook for <b>'+esc(service)+'</b>.</div>';return;}var r=rows[0];document.getElementById("modalBody").innerHTML='<div class="md"><div style="margin:6px 0 2px"><span class="st '+(r.auto_safe?'st-resolved':'')+'">'+(r.auto_safe?'auto-remediation safe':'human approval required')+'</span></div>'+mdToHtml(r.content||"")+'</div>';}catch(e){document.getElementById("modalBody").innerHTML='<div class="empty">Could not load runbook.</div>';}}
function mdToHtml(md){var lines=md.replace(/\r/g,"").split("\n"),out=[],i=0;function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`(.+?)`/g,"<code>$1</code>");}while(i<lines.length){var l=lines[i];if(/^\s*$/.test(l)){i++;continue;}if(/^#{1,6}\s/.test(l)){var h=l.match(/^#+/)[0].length;out.push("<h"+h+">"+inl(l.replace(/^#+\s/,""))+"</h"+h+">");i++;continue;}if(/^---+$/.test(l)){out.push("<hr>");i++;continue;}if(/^\s*\|.*\|/.test(l)){var tb=[];while(i<lines.length&&/^\s*\|.*\|/.test(lines[i])){tb.push(lines[i]);i++;}var rows=tb.filter(function(r){return !/^\s*\|[\s\-:|]+\|\s*$/.test(r);});out.push("<table>"+rows.map(function(r,ri){var cells=r.split("|").slice(1,-1).map(function(c){return c.trim();});var tag=ri===0?"th":"td";return "<tr>"+cells.map(function(c){return "<"+tag+">"+inl(c)+"</"+tag+">";}).join("")+"</tr>";}).join("")+"</table>");continue;}if(/^\s*[-*]\s/.test(l)){var li=[];while(i<lines.length&&/^\s*[-*]\s/.test(lines[i])){li.push("<li>"+inl(lines[i].replace(/^\s*[-*]\s/,""))+"</li>");i++;}out.push("<ul>"+li.join("")+"</ul>");continue;}var p=[];while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,6}\s|---+$|\s*[-*]\s|\s*\|)/.test(lines[i])){p.push(lines[i]);i++;}out.push("<p>"+inl(p.join(" "))+"</p>");}return out.join("");}
</script>
