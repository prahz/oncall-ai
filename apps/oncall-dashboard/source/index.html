<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oncall AI — Incident Command</title>
<style>
  :root{
    --bg:#0c0f14; --surface:#141922; --surface2:#1c222d; --border:#262d3a;
    --text:#e8edf5; --muted:#93a0b4; --dim:#5f6b7e;
    --accent:#4d8dff; --accent-h:#6aa0ff;
    --crit:#ff5c5c; --high:#ffa53d; --med:#4d8dff; --low:#6b7787;
    --ok:#36d399; --warn:#ffc24d;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.5}
  a{color:var(--accent)}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
  header .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:12px}
  header .live{margin-left:14px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
  .channels{margin-left:auto;display:flex;align-items:center;gap:8px}
  .chan{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 10px 5px 12px;font-size:12px;color:var(--muted)}
  .chan .nm{font-weight:600;color:var(--text)}
  .sw{position:relative;width:34px;height:18px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;transition:background .15s;flex:none}
  .sw::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
  .sw.on{background:rgba(54,211,153,.25);border-color:rgba(54,211,153,.5)}
  .sw.on::after{transform:translateX(16px);background:var(--ok)}
  .sw.busy{opacity:.5;cursor:default}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 20px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .stat .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .l{color:var(--muted);font-size:12px;margin-top:2px}
  .stat.crit .n{color:var(--crit)} .stat.warn .n{color:var(--warn)} .stat.ok .n{color:var(--ok)}
  .wrap{display:grid;grid-template-columns:minmax(340px,1fr) minmax(420px,1.3fr);gap:16px;padding:0 20px 24px}
  .col{min-width:0}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}
  .panel>.h{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
  .panel>.h .count{margin-left:auto;color:var(--dim);font-weight:500;font-size:12px}
  .panel>.h .pill{margin-left:auto;background:var(--warn);color:#1a1300;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
  .feed{max-height:60vh;overflow:auto}
  .inc{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;border-left:3px solid transparent}
  .inc:hover{background:var(--surface2)}
  .inc.sel{background:var(--surface2);border-left-color:var(--accent)}
  .inc .num{font-family:var(--mono);color:var(--dim);font-size:12px;min-width:54px}
  .inc .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .inc .svc{color:var(--muted);font-size:12px}
  .badge{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
  .b-critical{background:rgba(255,92,92,.16);color:var(--crit)}
  .b-high{background:rgba(255,165,61,.16);color:var(--high)}
  .b-medium{background:rgba(77,141,255,.16);color:var(--med)}
  .b-low{background:rgba(107,119,135,.18);color:var(--low)}
  .st{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted);text-transform:capitalize}
  .st-resolved{color:var(--ok);border-color:rgba(54,211,153,.35)}
  .st-mitigating,.st-triaging,.st-detected{color:var(--warn);border-color:rgba(255,194,77,.3)}
  .st-post_mortem_pending{color:var(--accent);border-color:rgba(77,141,255,.35)}
  /* approval cards */
  .appr{padding:16px;border-bottom:1px solid var(--border)}
  .appr:last-child{border-bottom:0}
  .appr .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .appr h3{margin:0;font-size:14px;font-weight:600}
  .appr .meta{color:var(--muted);font-size:12.5px;margin:6px 0}
  .appr .kv{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;margin:10px 0;font-size:13px}
  .appr .kv .k{color:var(--dim)}
  .appr .fix{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;font-size:13px;margin:8px 0}
  .appr .acts{display:flex;gap:8px;margin-top:12px}
  button{font:inherit;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
  .approve{background:var(--ok);color:#02160d}
  .approve:hover{filter:brightness(1.08)}
  .reject{background:transparent;color:var(--crit);border:1px solid rgba(255,92,92,.4)}
  .reject:hover{background:rgba(255,92,92,.1)}
  button:disabled{opacity:.5;cursor:default}
  .empty{padding:28px 16px;text-align:center;color:var(--dim);font-size:13px}
  /* detail */
  .det .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;padding:14px 16px;font-size:13px}
  .det .kv .k{color:var(--dim)}
  .det .sec{padding:12px 16px;border-top:1px solid var(--border)}
  .det .sec h4{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
  .row:last-child{border-bottom:0}
  .row .mono{font-family:var(--mono);color:var(--dim);font-size:11.5px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .toast.ok{border-color:rgba(54,211,153,.5)} .toast.err{border-color:rgba(255,92,92,.5)}
  .skel{padding:16px;color:var(--dim);font-size:13px}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <div>
    <h1>Oncall AI · Incident Command</h1>
    <div class="sub">the on-call engineer for teams without one</div>
  </div>
  <div id="channels" class="channels"></div>
  <div class="live"><span id="livedot" class="dot" style="background:var(--dim);box-shadow:none"></span><span id="livetxt">connecting…</span></div>
</header>

<div class="stats" id="stats">
  <div class="stat"><div class="n" id="s-open">–</div><div class="l">Active incidents</div></div>
  <div class="stat warn"><div class="n" id="s-await">–</div><div class="l">Awaiting approval</div></div>
  <div class="stat ok"><div class="n" id="s-auto">–</div><div class="l">Auto-remediated</div></div>
  <div class="stat"><div class="n" id="s-res">–</div><div class="l">Resolved</div></div>
</div>

<div class="wrap">
  <div class="col">
    <div class="panel">
      <div class="h">Incident feed <span class="count" id="feed-count"></span></div>
      <div class="feed" id="feed"><div class="skel">Loading incidents…</div></div>
    </div>
  </div>
  <div class="col">
    <div class="panel">
      <div class="h">🔔 Approval queue <span id="appr-pill"></span></div>
      <div id="approvals"><div class="skel">Loading…</div></div>
    </div>
    <div class="panel det">
      <div class="h">Incident detail</div>
      <div id="detail"><div class="empty">Select an incident from the feed.</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var cfg = window.__LEMMA_CONFIG__ || {};
  var base = (cfg.apiUrl || window.location.origin).replace(/\/$/,"");
  var s = document.createElement("script");
  s.src = base + "/public/sdk/lemma-client.js";
  s.onload = boot;
  s.onerror = function(){ document.getElementById("feed").innerHTML = '<div class="skel">Failed to load Lemma SDK.</div>'; };
  document.head.appendChild(s);
})();

var client, WF="incident_response", selectedId=null, incidents=[];

function esc(x){return (x==null?"":String(x)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function sevBadge(s){s=(s||"low").toLowerCase();return '<span class="badge b-'+s+'">'+esc(s)+'</span>';}
function stBadge(s){return '<span class="st st-'+esc(s)+'">'+esc((s||"").replace(/_/g," "))+'</span>';}
function toast(msg,kind){var t=document.getElementById("toast");t.textContent=msg;t.className="toast show "+(kind||"");setTimeout(function(){t.className="toast";},2600);}

async function boot(){
  try{
    client = new window.LemmaClient.LemmaClient();
    var state = await client.initialize();
    if(state.status!=="authenticated"){ client.auth.redirectToAuth(); return; }
    setLive(true);
    await refreshAll();
    // live incident feed via the table websocket
    try{
      client.datastore.watchChanges({ table:"incidents", onChange:function(){ refreshAll(); } });
    }catch(e){ /* websocket optional */ }
  }catch(e){
    setLive(false);
    document.getElementById("feed").innerHTML='<div class="skel">Error: '+esc(e&&e.message)+'</div>';
  }
}

function setLive(on){
  document.getElementById("livedot").style.background = on ? "var(--ok)" : "var(--crit)";
  document.getElementById("livedot").style.boxShadow = on ? "0 0 8px var(--ok)" : "none";
  document.getElementById("livetxt").textContent = on ? "live" : "offline";
}

async function refreshAll(){
  await Promise.all([loadFeed(), loadStats(), loadApprovals(), loadChannels()]);
  if(selectedId) loadDetail(selectedId);
}

async function loadChannels(){
  var el=document.getElementById("channels");
  if(!el) return;
  var rows;
  try{ rows=(await client.records.list("notification_settings",{limit:50})).items||[]; }
  catch(e){ el.innerHTML=""; return; }
  rows.sort(function(a,b){return (a.channel||"").localeCompare(b.channel||"");});
  el.innerHTML = rows.map(function(r){
    var on = r.enabled===true;
    return '<div class="chan"><span class="nm">'+esc(r.label||r.channel)+'</span>'+
      '<div class="sw'+(on?' on':'')+'" data-chan-id="'+esc(r.id)+'" data-on="'+(on?'1':'0')+'" title="'+(on?'Notifications on':'Notifications off')+'"></div></div>';
  }).join("");
  Array.prototype.forEach.call(el.querySelectorAll(".sw"),function(sw){
    sw.onclick=function(){ toggleChannel(sw); };
  });
}

async function toggleChannel(sw){
  if(sw.classList.contains("busy")) return;
  var id=sw.getAttribute("data-chan-id");
  var next = sw.getAttribute("data-on")!=="1";
  sw.classList.add("busy");
  try{
    await client.records.update("notification_settings", id, { enabled: next });
    sw.setAttribute("data-on", next?"1":"0");
    sw.classList.toggle("on", next);
    sw.title = next?"Notifications on":"Notifications off";
    toast(next?"Channel enabled":"Channel disabled", next?"ok":"");
  }catch(e){
    toast("Failed: "+(e&&e.message), "err");
  }finally{
    sw.classList.remove("busy");
  }
}

async function loadFeed(){
  var res = await client.records.list("incidents", { limit:100, sort:[{field:"created_at",direction:"desc"}] });
  incidents = res.items || [];
  document.getElementById("feed-count").textContent = incidents.length;
  var el = document.getElementById("feed");
  if(!incidents.length){ el.innerHTML='<div class="empty">No incidents yet. They appear here as alerts fire.</div>'; return; }
  el.innerHTML = incidents.map(function(i){
    return '<div class="inc'+(i.id===selectedId?' sel':'')+'" data-id="'+i.id+'">'+
      '<span class="num">INC-'+esc(i.number)+'</span>'+ sevBadge(i.severity)+
      '<span class="ti">'+esc(i.title||"(untitled)")+'<div class="svc">'+esc(i.service||"")+'</div></span>'+
      stBadge(i.status)+'</div>';
  }).join("");
  Array.prototype.forEach.call(el.querySelectorAll(".inc"),function(n){
    n.onclick=function(){ selectedId=n.getAttribute("data-id"); loadFeed(); loadDetail(selectedId); };
  });
}

async function loadStats(){
  try{
    var rows = (await client.datastore.query(
      "select status, count(*) c from incidents group by status")).items||[];
    var by={}; rows.forEach(function(r){by[r.status]=Number(r.c);});
    var active=(by.detected||0)+(by.triaging||0)+(by.mitigating||0);
    document.getElementById("s-open").textContent=active;
    document.getElementById("s-res").textContent=(by.resolved||0)+(by.post_mortem_pending||0);
    var auto=(await client.datastore.query(
      "select count(*) c from remediation_actions where auto_approved=true and status='executed'")).items||[];
    document.getElementById("s-auto").textContent=auto[0]?Number(auto[0].c):0;
    var pend=(await client.datastore.query(
      "select count(*) c from remediation_actions where status='pending_approval'")).items||[];
    document.getElementById("s-await").textContent=pend[0]?Number(pend[0].c):0;
  }catch(e){}
}

async function loadApprovals(){
  var el=document.getElementById("approvals");
  var runs;
  try{ runs=(await client.workflows.runs.list(WF,{limit:50})).items||[]; }
  catch(e){ el.innerHTML='<div class="empty">Could not load runs.</div>'; return; }
  var waiting=runs.filter(function(r){return r.status==="WAITING";});
  var cards=[];
  for(var k=0;k<waiting.length;k++){
    try{
      var run=await client.workflows.runs.get(waiting[k].id);
      var aw=run.active_wait||{}; if(aw.wait_type!=="HUMAN") continue;
      var ctx=run.execution_context||{}; var a=ctx.analyze||{}; var o=ctx.open||{};
      cards.push(renderAppr(run.id, aw.node_id, a, o));
    }catch(e){}
  }
  document.getElementById("appr-pill").innerHTML = cards.length? '<span class="pill">'+cards.length+' pending</span>':'';
  el.innerHTML = cards.length? cards.join("") : '<div class="empty">✓ Nothing awaiting approval. Safe fixes auto-remediate.</div>';
  Array.prototype.forEach.call(el.querySelectorAll("[data-approve]"),function(b){
    b.onclick=function(){ decide(b.getAttribute("data-run"), b.getAttribute("data-node"), true, b); };
  });
  Array.prototype.forEach.call(el.querySelectorAll("[data-reject]"),function(b){
    b.onclick=function(){ decide(b.getAttribute("data-run"), b.getAttribute("data-node"), false, b); };
  });
}

function renderAppr(runId, nodeId, a, o){
  var sev=o.final_severity||a.raw_severity||"high";
  return '<div class="appr">'+
    '<div class="top">'+sevBadge(sev)+'<h3>'+esc(a.title||"Incident")+'</h3></div>'+
    '<div class="kv">'+
      '<span class="k">Root cause</span><span>'+esc(a.root_cause||"—")+'</span>'+
      '<span class="k">Blast</span><span>'+esc((o.final_severity?o.blast_radius:a.blast_radius)||"single_service")+'</span>'+
      '<span class="k">Confidence</span><span>'+esc(a.confidence!=null?Math.round(a.confidence*100)+"%":"—")+'</span>'+
      '<span class="k">Why gated</span><span>'+esc(o.reason||"Needs human approval")+'</span>'+
    '</div>'+
    '<div class="fix"><b>Proposed fix:</b> '+esc(a.suggested_fix||a.action_type||"—")+'</div>'+
    '<div class="acts">'+
      '<button class="approve" data-approve data-run="'+runId+'" data-node="'+esc(nodeId)+'">Approve &amp; execute</button>'+
      '<button class="reject" data-reject data-run="'+runId+'" data-node="'+esc(nodeId)+'">Reject</button>'+
    '</div></div>';
}

async function decide(runId, nodeId, approved, btn){
  var card=btn.closest(".appr");
  Array.prototype.forEach.call(card.querySelectorAll("button"),function(b){b.disabled=true;});
  try{
    await client.workflows.runs.submitForm(runId, { node_id:nodeId, inputs:{ approved:approved } });
    toast(approved?"Approved — executing remediation…":"Rejected.", approved?"ok":"");
    setTimeout(refreshAll, 1200);
  }catch(e){
    toast("Failed: "+(e&&e.message), "err");
    Array.prototype.forEach.call(card.querySelectorAll("button"),function(b){b.disabled=false;});
  }
}

async function loadDetail(id){
  var inc=incidents.filter(function(i){return i.id===id;})[0];
  var el=document.getElementById("detail");
  if(!inc){ el.innerHTML='<div class="empty">Select an incident.</div>'; return; }
  var alerts=[], actions=[];
  try{ alerts=(await client.records.list("alerts",{limit:50,filters:[{field:"incident_id",op:"eq",value:id}]})).items||[]; }catch(e){}
  try{ actions=(await client.records.list("remediation_actions",{limit:50,filters:[{field:"incident_id",op:"eq",value:id}]})).items||[]; }catch(e){}
  el.innerHTML =
    '<div class="kv">'+
      '<span class="k">Incident</span><span>INC-'+esc(inc.number)+' · '+sevBadge(inc.severity)+' '+stBadge(inc.status)+'</span>'+
      '<span class="k">Title</span><span>'+esc(inc.title)+'</span>'+
      '<span class="k">Service</span><span>'+esc(inc.service)+'</span>'+
      '<span class="k">Blast radius</span><span>'+esc(inc.blast_radius)+'</span>'+
      '<span class="k">Root cause</span><span>'+esc(inc.root_cause||"—")+'</span>'+
      '<span class="k">Suggested fix</span><span>'+esc(inc.suggested_fix||"—")+'</span>'+
      '<span class="k">Suspect deploy</span><span>'+esc(inc.suspect_deploy||"unknown")+'</span>'+
      '<span class="k">Confidence</span><span>'+esc(inc.confidence!=null?Math.round(inc.confidence*100)+"%":"—")+'</span>'+
    '</div>'+
    '<div class="sec"><h4>Triggering alerts ('+alerts.length+')</h4>'+
      (alerts.length?alerts.map(function(x){return '<div class="row">'+sevBadge(x.severity)+'<span>'+esc(x.message||x.metric)+'</span><span class="mono" style="margin-left:auto">'+esc(x.source)+'</span></div>';}).join(""):'<div class="empty">none</div>')+'</div>'+
    '<div class="sec"><h4>Remediation ('+actions.length+')</h4>'+
      (actions.length?actions.map(function(x){return '<div class="row"><span>'+esc(x.action_type)+'</span><span style="color:var(--muted)">'+esc(x.description||"")+'</span><span class="st '+(x.status==="executed"?"st-resolved":"")+'" style="margin-left:auto">'+esc(x.status)+(x.auto_approved?" · auto":"")+'</span></div>';}).join(""):'<div class="empty">none</div>')+'</div>';
}
</script>
</body>
</html>
